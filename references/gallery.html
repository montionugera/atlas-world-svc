<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --border: #2a2f3d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  h1 { margin: 0; font-size: 22px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  select, input {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #090b10;
    border-bottom: 1px solid var(--border);
  }
  .meta { padding: 10px 12px; font-size: 12px; }
  .title { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .badge {
    padding: 2px 6px;
    border-radius: 4px;
    background: #232838;
    color: var(--accent);
    font-size: 11px;
  }
</style>

  const grid = document.getElementById('grid');
  const gameFilter = document.getElementById('gameFilter');
  const catFilter = document.getElementById('catFilter');
  const searchInput = document.getElementById('searchInput');

  function render() {
    const g = gameFilter.value;
    const c = catFilter.value;
    const q = searchInput.value.toLowerCase().trim();
    const filtered = items.filter(it => {
      if (g && it.game !== g) return false;
      if (c && it.category !== c) return false;
      if (q && !(it.title.toLowerCase().includes(q) || (it.queryTag || '').toLowerCase().includes(q))) return false;
      return true;
    });
    grid.innerHTML = filtered.map(it => {
      const rel = it.localPath.replace(/^references\//, '');
      return `
        <div class="card">
          <a href="${rel}" target="_blank" rel="noopener">
            <img src="${rel}" loading="lazy" alt="${it.title}" />
          </a>
          <div class="meta">
            <div class="title">${it.title}</div>
            <div style="color: var(--muted);">${it.width}&times;${it.height}px • ${(it.bytes / 1024).toFixed(1)} KB</div>
            <div class="badges">
              <span class="badge">${it.game}</span>
              <span class="badge">${it.category}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }
  gameFilter.addEventListener('change', render);
  catFilter.addEventListener('change', render);
  searchInput.addEventListener('input', render);
  render();
</script>
