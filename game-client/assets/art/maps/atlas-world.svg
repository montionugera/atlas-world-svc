<text x="45.8" y="199.6" font-size="11.5" font-style="italic" fill="#5d5344" text-anchor="middle" transform="rotate(-90 45.8 199.6)">the trade wind · once a year</text>
<text x="758" y="520" text-anchor="middle" font-size="42" letter-spacing="10">THE ATLAS WORLD</text>
<text x="758" y="560" text-anchor="middle" font-size="17" font-style="italic" fill="#5d5344">such ground as the Bellfaith can vouch for</text>
<text x="758" y="612" text-anchor="middle" font-size="13" font-style="italic" fill="#5d5344">A world sheet drawn by the same hands that keep the basin map. It records</text>
<text x="758" y="631" text-anchor="middle" font-size="13" font-style="italic" fill="#5d5344">what has been walked, sounded, or seen from a tower; it does not guess. The</text>
<text x="758" y="650" text-anchor="middle" font-size="13" font-style="italic" fill="#5d5344">empty parchment is not modesty — it is the honest extent of the survey.</text>
<text x="758" y="699" text-anchor="middle" font-size="13" letter-spacing="4" fill="#5d5344">NOT SHOWN ON THIS SHEET</text>
<text x="758" y="721" text-anchor="middle" font-size="12.5" fill="#5d5344">·  every coast, reef and landmass beyond a day's sail of Gildmark</text>
<text x="758" y="739" text-anchor="middle" font-size="12.5" fill="#5d5344">·  whatever lies past the ice</text>
<text x="758" y="757" text-anchor="middle" font-size="12.5" fill="#5d5344">·  the far shore of the western sea, if it has one</text>
