<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Mana Potion (placeholder icon)</title>
  <!-- 16x16 pixel-art placeholder — hand-authored, CC0. Seeds the `image`
       render-type for the asset storybook / drift-gate (F-002 Phase 1c). -->
  <rect x="0" y="0" width="16" height="16" fill="none" />
  <!-- cork -->
  <rect x="6" y="1" width="4" height="2" fill="#8a5a34" />
  <!-- glass neck -->
  <rect x="6" y="3" width="4" height="2" fill="#cfe3e8" />
  <!-- glass shoulder -->
  <rect x="4" y="5" width="8" height="2" fill="#cfe3e8" />
  <!-- bottle outline -->
  <rect x="3" y="7" width="10" height="6" fill="#cfe3e8" />
  <rect x="4" y="13" width="8" height="1" fill="#cfe3e8" />
  <rect x="5" y="14" width="6" height="1" fill="#cfe3e8" />
  <!-- blue liquid fill -->
  <rect x="4" y="8" width="8" height="4" fill="#3f7fe0" />
  <rect x="5" y="12" width="6" height="1" fill="#3f7fe0" />
  <rect x="6" y="13" width="4" height="1" fill="#325fb0" />
  <!-- highlight -->
  <rect x="5" y="9" width="1" height="2" fill="#8fc0ff" />
</svg>
