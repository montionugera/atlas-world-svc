<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas-world-svc — Combat Balance Lab</title>
    <style>
      :root {
        --bg: #0b0d12;
        --bg-elev: #12151d;
        --bg-card: #171b26;
        --border: #262c3a;
        --border-hover: #3a4256;
        --text: #e7e9ee;
        --text-dim: #9aa1b2;
        --text-faint: #656d80;
        --accent: #7c9eff;
        --ok: #7ee787;
        --err: #ff7b72;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        --loss: #ff7b72;
        --brutal: #ff9f6e;
        --hard: #f2b84b;
        --fair: #7ee787;
        --easy: #56d4dd;
        --trivial: #7c9eff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      h2 {
        margin: 34px 0 6px;
        font-size: 15px;
      }
      main {
        padding: 0 24px 80px;
        max-width: 1400px;
      }
      .meta {
        font-size: 12px;
        color: var(--text-faint);
        font-family: var(--mono);
      }
      a {
        color: var(--accent);
      }
      code {
        font-family: var(--mono);
        background: #ffffff0d;
        padding: 1px 5px;
        border-radius: 3px;
      }

      .panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .qline {
        color: var(--text-dim);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .qline b {
        color: var(--text);
        font-weight: 600;
      }

      .grid-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 14px 20px;
      }
      .input-row label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .input-row label b {
        font-family: var(--mono);
        color: var(--accent);
        font-weight: 600;
      }
      .input-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      button {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 6px;
        padding: 6px 12px;
        font-family: var(--sans);
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      th,
      td {
        text-align: right;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;

        color: var(--text-faint);
        font-weight: 500;

        color: var(--hard);

      .b-fair {
        background: #7ee78722;
        color: var(--fair);

      .b-easy {
        background: #56d4dd22;
        color: var(--easy);
      }
      .b-trivial {
        background: #7c9eff22;

      button.rule {
        text-transform: lowercase;

      button.rule.on {
        border-color: var(--accent);
        color: var(--accent);

      }
      .card.fail .verdict {

      }
      .card .bound {

        color: var(--text-faint);
        font-family: var(--mono);
      }

      .banner {
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        margin: 12px 0;
        border: 1px solid;
      }
      .banner.ok {
        background: #7ee7870f;
        border-color: #7ee78744;
        color: var(--ok);
      }
      .banner.bad {
        background: #ff7b720f;
        border-color: #ff7b7244;
        color: var(--err);
      }
      .banner.info {
        background: #7c9eff0f;
        border-color: #7c9eff44;

      }

      .PASS {

        font-weight: 600;
      }

      }
      .dim {

      }
      .legend-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

        letter-spacing: 0.06em;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 4px;

      ul.notes li {

      }
      .gloss-t th {
        text-align: left;
      }
      td.gloss {
        text-align: left;
        white-space: normal;
        font-family: var(--sans);
        font-size: 13px;
      }
      td.gloss:first-child {
        font-family: var(--mono);
        font-size: 12px;
        white-space: nowrap;
      }
      #err {
        padding: 40px 24px;
      }

  <body>
    <header>
      <h1>
        Combat Balance Lab
        <span class="dim" style="font-weight: 400">— I-028</span>
      </h1>
      <div class="meta" id="hdr">loading…</div>
    </header>
    <main id="app"></main>
    <div id="err" hidden>
      <div class="banner bad">
        <b>Could not load <code>combat-model.json</code>.</b><br />
        Browsers block <code>fetch()</code> over <code>file://</code>. Serve the
        folder:<br /><br />
        <code>cd tools/combat-lab &amp;&amp; python3 -m http.server 8421</code>
      </div>
    </div>

    <script>
      // ============================================================== model ==
      // The I-028 combat model. Nothing here reads the game — this is the
      // foundation on its own terms. Mirrors model/balance_sheet.py; verify.mjs
      // asserts the two agree.

      let DATA = null; // parsed combat-model.json
      let P = {}; // live tunable inputs, slider-editable

      const grow = (L) => Math.pow(P.growth, L - 1);

      /**
       * REFERENCE HP curve — a constant, not anyone's actual HP.
       *
       * This distinction is load-bearing. If damage scaled with the target's own
       * HP, bigger bars would take proportionally bigger hits and stacking HP
       * would do nothing at all. As a reference curve it only makes `k` readable:
       * k is the share of a typical HP bar one even hit removes, so 1/k is
       * hits-to-kill in an even fight.
       */
      const refHp = (L) => P.baseHp * grow(L);

      const clampL = (x) => Math.max(1, Math.min(P.levelMax, x));

      /** The level a mob is SHOWN at. Rank does not imply a level. */
      const mobShownLevel = (L) => clampL(L + (P.mobLevelDelta || 0));

      /**
       * The level a mob FIGHTS at. Level gap weight scales how much of a level
       * difference actually counts: 1.0 is the full stat difference, 0.6 makes a
       * 10-level gap fight like a 6-level one.
       *
       * It exists because gap steepness is growth-squared per level, and growth
       * is pinned to 1.042-1.048 by the 20-level progression invariant. The whole
       * legal range moves the gap 9.2% -> 8.6%, so softening it at all needs a
       * separate knob.
       */
      const mobLevel = (L) =>
        clampL(L + (P.mobLevelDelta || 0) * (P.gapWeight ?? 1));

      /** The encounter size a rank's multiplier was originally solved against. */
      const rankRef = (rank) =>
        DATA.proposed.ladder.find((x) => x.rank === rank).n;

      /**
       * Resolve a player to its FOUR axes — two magnitudes and two directions.
       * Accepts {build, gear, focus, gearClass} or a legacy grade name, which is
       * just a named point on the build x gear diagonal.
       *
       * Both directions default to balanced, so anything that does not name them
       * reproduces the model exactly as it stood before they existed.
       */
      function resolve(spec) {
        const s =
          typeof spec === "string"
            ? DATA.proposed.grades.find((x) => x.grade === spec)
            : spec;
        const b = DATA.proposed.builds.find((x) => x.build === s.build);
        const g = DATA.proposed.gearTiers.find((x) => x.tier === s.gear);
        const f = s.focus
          ? DATA.proposed.focuses.find((x) => x.focus === s.focus)
          : null;
        const lean =
          s.gearClass === "dps"
            ? P.gearLean
            : s.gearClass === "tank"
              ? 1 - P.gearLean
              : 0.5;
        return {
          alloc: b.alloc,
          gearScale: g.scale,
          off: f ? f.off : 0.5,
          lean,
        };
      }

      /**
       * A budget applies ONCE and is split among the stats it buys.
       *
       * That rule is what keeps everything symmetric: the defensive budget is
       * shared between hp and def as sqrt each, so hp x def is exactly the budget
       * and the two are perfectly interchangeable. Neither is a trap stat, and
       * neither side of the fight double-dips.
       */
      function player(L, spec) {
        const { alloc: a, gearScale: gs, off, lean } = resolve(spec);
        const g = grow(L),
          C = P.statCoef;
        const atkBudget = (1 + 2 * C * a * off) * (gs * 2 * lean);
        const defBudget = (1 + 2 * C * a * (1 - off)) * (gs * 2 * (1 - lean));
        const half = Math.sqrt(defBudget);
        const atk = P.baseAtk * g * atkBudget;
        const def = P.baseDef * g * half;
        const hp = refHp(L) * half;
        return {
          atk,
          def,
          hp,
          // Geometric mean of the three, so it grows at exactly `growth`.
          cs: Math.cbrt(atk * def * hp),
          mspd: Math.min(P.mspdBase * (1 + C * a), P.mspdCap),
          mspdRaw: P.mspdBase * (1 + C * a),
        };
      }

      /**
       * A mob is the max-grade player at its own level with its CombatScore
       * scaled by the rank multiplier. CS is the geometric mean of the three
       * stats, so scaling each stat by mult scales CS by exactly mult — and R,
       * which is the ratio of the products, by mult^3.
       */
      /**
       * THREE multipliers per rank, not one.
       *
       * With a single multiplier, TTK and R are welded together as
       * TTK ∝ R^(-2/3): the ladder's 16.7x difficulty span permits a 6.5x span
       * in fight length and no more, while the committed TTK table wants 1071x.
       * Splitting atk / def / hp breaks the weld, because
       *
       *   R    = 1 / (atk x def x hp)      difficulty
       *   TTK ∝       def x hp             duration
       *
       * are independent. Solved in closed form from the rank's target R and
       * target seconds, at the CURRENT slider values, so both hold live.
       *
       * Ranks with no ttk target fall back to one uniform multiplier — see the
       * generator for why S and above have none.
       */
      /**
       * Danger implied by a rank's authored swings-to-kill-a-player.
       * For a boss the damage spreads across the party, so one player's share
       * is 1/n of it — but `swings` still means swings against ONE player.
       */
      const rankDanger = (rk) =>
        (100 * P.aspd) / (rk.swings * (rk.shape === "boss" ? rk.n : 1));

      function rankMults(rk) {
        // Hits a lone max-grade player needs to survive a mob of attack 1.0.
        const C = P.baseDef / (P.k * P.baseAtk);
        const danger = rankDanger(rk);
        // Durability budget split. def x hp is what difficulty and duration
        // pin; where it sits between the two changes NO outcome, only how the
        // numbers read. See `durabilityHp`.
        const psi = P.durabilityHp ?? 0.5;
        const split = (dh) => ({
          d: Math.pow(dh, 1 - psi),
          h: Math.pow(dh, psi),
        });
        if (rk.shape === "boss") {
          // n players, ONE mob. R = R_solo × n², and the boss's damage is
          // shared across the party — so `danger` is one player's share.
          const a = (danger * C * rk.n) / (100 * P.aspd);
          const dh = (rk.n * rk.n) / (rk.r * a);
          return { a, ...split(dh), ttk: 100 / (rk.r * danger) };
        }
        // n players, n mobs. R = R_solo × 2n/(n+1).
        const rSolo = (rk.r * (rk.n + 1)) / (2 * rk.n);
        const ttkTarget = 100 / (rSolo * danger);
        const dh = (ttkTarget * P.k * P.baseAtk * P.aspd) / P.baseDef;
        // a is proportional to danger, which is why a rising danger curve makes
        // mob attack rise rank by rank.
        return { a: 1 / (rSolo * dh), ...split(dh), ttk: ttkTarget };
      }

      function mob(L, rank) {
        const rk = DATA.proposed.ladder.find((x) => x.rank === rank);
        const ref = player(L, "max");
        const { a, d, h } = rankMults(rk);
        return {
          mult: rk.mult,
          atkMult: a,
          defMult: d,
          hpMult: h,
          atk: ref.atk * a,
          def: ref.def * d,
          hp: ref.hp * h,
          cs: ref.cs * Math.cbrt(a * d * h),
        };
      }

      /** One hit: k x refHp(defender level) x (atk / def). */
      const hit = (att, dfn, Ldef) => P.k * refHp(Ldef) * (att.atk / dfn.def);

      /**
       * R = how long the player survives / how long the encounter survives.
       * R > 1 is a win and 1 - 1/R is the HP left.
       *
       * n = 1 is THE FOUNDATION. The level gap enters only through atk/def and
       * refHp, already damped by gapWeight inside mobLevel.
       *
       * n > 1 layers on the party factor 2n/(n+1): the party focus-fires, so mobs
       * die one at a time and the average number still alive is (n+1)/2 rather
       * than n. Encounter size is a property of the FIGHT, not of the mob's rank.
       */
      function R(L, rank, spec, n = 1) {
        const p = player(L, spec),
          Lm = mobLevel(L),
          m = mob(Lm, rank);
        const single = hitsToDie(p, m, L) / hitsToKill(p, m, Lm);
        if (n <= 1) return single;
        const rk = DATA.proposed.ladder.find((x) => x.rank === rank);
        // boss: damage concentrates one way and spreads the other, so n².
        // pack: mobs die one at a time, so 2n/(n+1), bounded at 2×.
        return rk.shape === "boss"
          ? single * n * n
          : (single * 2 * n) / (n + 1);
      }

      const hitsToKill = (p, m, Lm) => m.hp / hit(p, m, Lm);
      const hitsToDie = (p, m, L) => p.hp / hit(m, p, L);

      /**
       * Seconds to kill. For a boss this is the WALL CLOCK for the whole party
       * (n players share the work); for a pack it is one player on one mob.
       */
      function ttk(L, rank, spec) {
        const Lm = mobLevel(L);
        const rk = DATA.proposed.ladder.find((x) => x.rank === rank);
        const solo = hitsToKill(player(L, spec), mob(Lm, rank), Lm) / P.aspd;
        return rk.shape === "boss" ? solo / rk.n : solo;
      }

      function band(r) {
        for (const b of DATA.proposed.bands)
          if (b.max === null || r < b.max) return b.name;
        return "trivial";
      }
      const hpLeft = (r) =>
        r > 1 ? `${((1 - 1 / r) * 100).toFixed(0)}%` : "—";
      const midLevel = (rk) => Math.floor((rk.from + rk.to) / 2);

      function requirements() {
        return DATA.proposed.requirements.map((q) => {
          const r = R(q.level, q.rank, q.grade, q.solo ? 1 : rankRef(q.rank));
          return { ...q, r, band: band(r), ok: r >= q.min && r < q.max };
        });
      }

      function invariants() {
        const C = P.statCoef,
          G = P.growth;
        const statShare = C / (1 + C);
        const reqs = requirements();
        const flat = [1, 25, 50, 75, P.levelMax].map((L) =>
          R(L, "C", "max", 1),
        );
        // hp and def are interchangeable: moving the defensive budget between
        // them must not move CombatScore at all.
        const hi = player(50, "max");
        const evenHits = 1 / P.k;

        return [
          [
            "20-level growth in 120–160%",
            `${((Math.pow(G, 20) - 1) * 100).toFixed(0)}%`,
            Math.pow(G, 20) - 1 >= 1.2 && Math.pow(G, 20) - 1 <= 1.6,
          ],
          [
            "CS compounds at the growth rate",
            `${((player(2, "max").cs / player(1, "max").cs - 1) * 100).toFixed(2)}%`,
            Math.abs(player(2, "max").cs / player(1, "max").cs - G) < 1e-9,
          ],
          [
            // What makes 1/k readable as hits-to-kill. Breaks if baseAtk/baseDef
            // drift apart, or if the defensive budget stops being split as sqrt.
            "mirror match is an even fight",
            `atk/def ${(hi.atk / hi.def).toFixed(4)}`,
            Math.abs(hi.atk / hi.def - 1) < 0.01,
          ],
          [
            "even fight is 1/k hits",
            `${evenHits.toFixed(1)} hits`,
            evenHits >= 2 && evenHits <= 20,
          ],
          [
            "stat share ≥25% at every level",
            `${(statShare * 100).toFixed(1)}% flat`,
            statShare >= 0.25,
          ],
          [
            "stat cap never exceeds 99",
            `${DATA.proposed.statCapAtLMax}`,
            DATA.proposed.statCapAtLMax <= 99,
          ],
          [
            "all four requirements",
            `${reqs.filter((q) => q.ok).length}/${reqs.length}`,
            reqs.every((q) => q.ok),
          ],
          [
            `move speed within clamp ${P.mspdCap}`,
            `${player(P.levelMax, "max").mspd.toFixed(1)}`,
            player(P.levelMax, "max").mspdRaw <= P.mspdCap,
          ],
          [
            "R invariant to absolute level",
            `${flat[0].toFixed(4)} at every level`,
            Math.max(...flat) - Math.min(...flat) < 1e-9,
          ],
        ];
      }

      // ============================================================= render ==

      /** Every abbreviation on the page. A header missing here fails verify.mjs. */
      const TERMS = {
        "mob rank": [
          "Mob rank",
          "Content tier E through SSS. Sets how strong one mob is RELATIVE to a same-level player. It does not imply a level or a headcount.",
        ],
        "mob CS ÷ player CS": [
          "Rank multiplier",
          "The mob's CombatScore as a fraction of a max-grade same-level player's. 0.5 means half as strong as you.",
        ],
        was: [
          "Previous multiplier",
          "The value before I-028. Comparison only — no calculation uses it.",
        ],
        "R · 1v1": [
          "R for a single duel",
          "One player against one mob. This is the foundation; everything else layers on top of it.",
        ],
        "player HP left": [
          "Player HP remaining",
          "1 − 1/R. Blank when you lose.",
        ],
        "player build": [
          "Stat allocation completeness",
          "How fully stat points were spent: low 0.4, mid 0.7, high 1.0.",
        ],
        "player gear": [
          "Equipment tier",

        ],

        ],

          "One of the three reference players",
          "max = A gear + every stat point spent, median = C gear + 70%, min = E gear + 40%. Ladders ① and ② quote `max` only.",
        ],

          "Equipment tier and its budget scale",
          "E 0.70, C 0.85, A 1.00. INVENTED: there is no rarity or tier field anywhere in the game — this is authored design data.",
        ],

          "Share of your earned stat points actually put into combat stats",
          "The `alloc` term. Enters as (1 + C·alloc), so at C = 0.5 levelling gives the 1 for free and points add up to +50% — one third of your power. 40% → 100% is 1.25× budget = 1.56× R, a weaker lever than gear's 2.04×. Abstracts the game's str/agi/int/vit pool without mapping onto it.",
        ],
        HP: ["Health bar at this level", "refHp(level) × √(defensive budget)."],
        atk: [
          "Attack stat",
          "The numerator of atk/def. Scales with the full budget, not its square root — the only stat that does.",
        ],
        def: [
          "Defence stat",
          "The denominator of atk/def. Shares the defensive budget with HP, √ each, so the two are exactly interchangeable.",
        ],
        CombatScore: [
          "cbrt(atk × def × hp)",
          "The single number a side's strength collapses to. Grows at exactly `growth` per level; R is the ratio of two of them, cubed.",
        ],
        "E gear · low build": [
          "Weakest reference player",
          "E-tier gear, 40% of stat points spent. Budget 0.84 — the floor of what someone can bring to a rank.",
        ],
        "C gear · mid build": [
          "Median reference player",
          "C-tier gear, 70% of stat points spent. Budget 1.15. The one to balance against if the ladder should suit a typical player.",
        ],
        "A gear · high build": [
          "Strongest reference player",
          "A-tier gear, every stat point spent. Budget 1.50. This is the player ladders ① and ② quote, so those tables read optimistically.",
        ],
        effect: ["Plain-language summary", "The same number as a percentage."],
        invariant: [
          "Structural property",
          "Something the model must satisfy regardless of tuning. A FAIL means the current settings broke the design.",
        ],
      };

      const n0 = (v) =>
        v.toLocaleString(undefined, { maximumFractionDigits: 0 });
      const rCell = (r) =>
        `<span class="pill b-${band(r)}">${r.toFixed(2)} ${band(r)}</span>`;

      function th(h) {
        const key = String(h)
          .replace(/<[^>]*>/g, "")
          .trim();
        const t = TERMS[key];
        return t
          ? `<th><span class="term" title="${t[0]} — ${t[1]}">${h}</span></th>`
          : `<th>${h}</th>`;
      }

      function table(headers, rows) {
        return `<div class="scroll"><table><thead><tr>${headers.map(th).join("")}</tr></thead>
          <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
          </table></div>`;
      }

      /** Title plus one line stating what the table answers and whose numbers they are. */
      function section(title, question) {
        return `<h2>${title}</h2><div class="qline">${question}</div>`;
      }

      function renderLegend() {
        const bands = DATA.proposed.bands
          .map(
            (b) =>
              `<span class="pill b-${b.name}">${b.name}</span> ${b.max === null ? "≥ 8" : `&lt; ${b.max}`}`,
          )
          .join(" · ");
        return `${section(
          "How to read this page",
          "One hit is <code>k × refHp(defender level) × (atk / def)</code>. Three things vary: the <b>player</b> (level, build, gear), the <b>mob</b> (rank), and the <b>encounter</b> (pack or boss).",
        )}
        <div class="panel">
          <div class="legend-grid">
            <div><div class="legend-h">PLAYER</div><div class="legend-b">
              <code>build</code> = how fully stat points were spent. <code>gear</code> = equipment tier.
              <code>CS</code> = CombatScore = the geometric mean of <code>atk</code>, <code>def</code>
              and <code>hp</code>, so it grows at exactly the growth rate per level.</div></div>
            <div><div class="legend-h">MOB</div><div class="legend-b">
              <code>rank</code> = E → SSS, set by two targets: <b>R</b> (how hard) and <b>danger</b>
              (share of your health bar drained per second). Fight length is <i>derived</i> from the pair.
              E–A are <b>packs</b>; S and above are <b>bosses</b>, n players against one.</div></div>
            <div><div class="legend-h">OUTCOME — R</div><div class="legend-b">
              How long the <b>player</b> survives ÷ how long the <b>encounter</b> survives.
              <code>R &gt; 1</code> = win, <code>1 − 1/R</code> = HP left. A duel is exactly
              <code>(CS_player / CS_mob)³</code>; a pack multiplies by <code>2n/(n+1)</code>
              and a boss by <code>n²</code>.</div></div>
          </div>
          <div class="legend-h" style="margin-top:14px">BANDS</div>
          <div class="legend-b">${bands}</div>
        </div>`;
      }

      function renderInputs() {
        const defs = DATA.proposed.inputs;
        return `${section(
          "Inputs — the knobs",
          "These drive <b>both</b> sides: a mob is a scaled copy of the max-grade player, so anything applied to both cancels in R. Only <code>Stat coefficient C</code>, <code>Encounter size</code>, <code>Mob level − player level</code> and the rank multipliers change an outcome.",
        )}
        <div class="panel grid-inputs">${Object.entries(defs)
          .map(
            ([k, d]) => `<div class="input-row">
            <label for="in-${k}">${d.label} <b id="lbl-${k}">${P[k]}</b></label>
            <input type="range" id="in-${k}" data-key="${k}" min="${d.min}" max="${d.max}" step="${d.step}" value="${P[k]}" />
          </div>`,
          )
          .join("")}</div>
        <div style="margin-top:10px"><button id="reset">Reset to spec defaults</button></div>`;
      }

      function renderRequirements() {
        const reqs = requirements();
        const all = reqs.every((r) => r.ok);
        return `${section(
          "Requirements — the four outcomes you specified",
          "Each card fixes a <b>player</b> grade, a <b>mob</b> rank and a level, then checks R lands in the band you asked for. These use each rank's reference encounter size, not the slider.",
        )}
        <div class="banner ${all ? "ok" : "bad"}">${all ? "ALL FOUR PASS" : `${reqs.filter((r) => !r.ok).length} FAILING`}</div>
        <div class="cards">${reqs
          .map(
            (q) => `<div class="card ${q.ok ? "pass" : "fail"}">
          <div class="req">${q.label}</div>
          <div class="val">${q.r.toFixed(2)} <span class="pill b-${q.band}">${q.band}</span></div>
          <div class="verdict">${q.ok ? "PASS" : "FAIL"}</div>
          <div class="bound">needs ${q.min} ≤ R &lt; ${q.max} · L${q.level} ${q.rank} ${q.grade} ${q.solo ? "1v1" : "party"}</div>
        </div>`,
          )
          .join("")}</div>`;
      }

      /**
       * Two tables, not one. Eleven columns overflowed horizontally and mixed
       * two different questions in one row — what you do to the mob, and what
       * the mob does to you. They are split along that seam.
       */
      function renderLadder() {
        const L = P.exampleLevel;
        const p = player(L, "max");
        const perMin = P.aspd * 60;
        const each = DATA.proposed.ladder.map((rk) => {
          const Lm = mobLevel(L),
            m = mob(Lm, rk.rank);
          return {
            rk,
            m,
            yours: hit(p, m, Lm),
            theirs: hit(m, p, L),
            T: ttk(L, rk.rank, "max"),
            r: R(L, rk.rank, "max", rk.n),
            enc:
              rk.shape === "boss"
                ? `${rk.n}v1 boss`
                : rk.n > 1
                  ? `${rk.n}v${rk.n}`
                  : "1v1",
          };
        });
        const secs = (T) => (T < 100 ? `${T.toFixed(1)}s` : `${T.toFixed(0)}s`);

        const offence = each.map((e) => [
          `<b>${e.rk.rank}</b>`,
          e.enc,
          n0(e.m.hp),
          n0(e.m.def),
          n0(e.yours),
          perMin.toFixed(0),
          n0(e.yours * perMin),
          (e.m.hp / e.yours).toFixed(0),
          secs(e.T),
        ]);

        const defence = each.map((e) => [
          `<b>${e.rk.rank}</b>`,
          e.enc,
          n0(e.m.atk),
          `${n0(e.theirs)} <span class="dim">(${((e.theirs / p.hp) * 100).toFixed(1)}%)</span>`,
          n0(e.theirs * perMin),
          (p.hp / e.theirs).toFixed(0),
          `${(100 / (e.r * e.T)).toFixed(2)}%/s`,
          secs(e.T),
          hpLeft(e.r),
          rCell(e.r),
        ]);

        const you = `<div class="panel" style="margin-bottom:12px">
          <div class="legend-h">YOU — A-tier gear, every stat point spent, level ${L}</div>
          <div class="legend-b" style="font-family:var(--mono);font-size:13px;color:var(--text)">
            HP <b>${n0(p.hp)}</b> &nbsp;·&nbsp; atk <b>${n0(p.atk)}</b> &nbsp;·&nbsp; def <b>${n0(p.def)}</b>
            &nbsp;·&nbsp; ${P.aspd} swings/s
          </div>
          <div class="legend-b" style="margin-top:6px">
            Every damage figure below is against <b>this</b> health bar — that is what the
            percentages are a share of. HP grows with level; the outcomes do not.
            This is the <b>strongest player in the model</b>, so both ladders read
            optimistically. Ladder ③ asks the same questions of the weaker tiers.
          </div>
        </div>`;

        return `${section(
          "Rank ladder ① — what YOU do to the mob",
          `A <b>max-grade player at level ${L}</b> against each rank
           (drag <code>Worked example level</code> to move it). Every column is quoted at the
           rank's own encounter shape — a boss row is not a duel, and for a boss the
           swings are per player while the kill is the party's wall clock.`,
        )}
        ${you}
        ${table(
          [
            "mob rank",
            "encounter",
            "mob HP",
            "mob def",
            "your damage / hit",
            "your hits / min",
            "your damage / min",
            "swings to kill",
            "time to kill",
          ],
          offence,
        )}

        ${section(
          "Rank ladder ② — what the MOB does to you",
          `The same fights from the other side. <b>R</b> and <b>player HP left</b> do not depend on
           level at all; the damage figures do, because they are absolute. Only the level
           <i>difference</i> changes an outcome.`,
        )}
        ${table(
          [
            "mob rank",
            "encounter",
            "mob atk",
            "its damage / hit",
            "its damage / min",
            "swings to kill you",
            "danger per second",
            "time to kill",
            "player HP left",
            "R",
          ],
          defence,
        )}
        ${renderPartyFactor()}`;
      }

      function renderPartyFactor() {
        const rows = [1, 2, 4, 8, 20, 50].map((n) => [
          n,
          ((2 * n) / (n + 1)).toFixed(3),
          `${(((n + 1) / 2 / n) * 100).toFixed(0)}%`,
          `${(((2 * n) / (n + 1) - 1) * 100).toFixed(0)}% easier than 1v1`,
        ]);
        return `<div class="panel" style="margin-top:14px">
          <div class="legend-h">WHY n MATTERS — 4v4 IS NOT THE SAME AS 1v1</div>
          <div class="legend-b" style="margin-bottom:12px">
            The party <b>focus-fires</b>: all n players hit one mob, so mobs die one at a time and the pack's
            damage decays. The average number still alive is <code>(n+1)/2</code>, not <code>n</code>, so you
            absorb far less than n mobs could theoretically deal. That is <code>2n/(n+1)</code> — and it is
            <b>bounded at 2×</b>. No party size makes a symmetric fight more than twice as favourable as a duel.
          </div>
          ${table(
            [
              "encounter size (n)",
              "party factor 2n/(n+1)",
              "damage you actually take",
              "effect",
            ],
            rows,
          )}
          <div class="banner info" style="margin-top:12px">
            <b>This is a specification, not a measurement.</b> It holds only while mobs do not coordinate focus
            fire. If they all attacked one player the n² terms cancel by symmetry and R collapses to the duel
            value. So <b>"mobs must not coordinate target selection" is a requirement the AI has to satisfy</b>,
            and it belongs in the spec beside the multipliers.
            <br /><br />
            <b>Open design question:</b> the model has no concept of formation, yet formation decides whether
            this factor applies at all — a clumped party is nearest to every mob at once. How much positioning
            should be worth (currently up to 1.96×, implicitly) has not been decided.
          </div>
        </div>`;
      }

      /**
       * Ladders ① and ② are quoted for ONE player — A-tier gear with every
       * stat point spent. That is the strongest player in the model, so those
       * two tables are the optimistic reading of every rank. This one asks the
       * same questions of all three tiers.
       *
       * Everything follows from a single number. A tier's budget is
       * `(1 + C·alloc) × gearScale`, and it reaches the stats as
       *
       *   atk ∝ budget      def, hp ∝ √budget      CS ∝ budget^(2/3)
       *   R ∝ budget²       swings you survive ∝ budget
       *
       * so R between tiers is the budget ratio SQUARED. The gear scale spans
       * only 0.70→1.00 and the allocation 0.4→1.0, but together they square
       * into a ~3.2× spread in outcome. That squaring is why a tier gap this
       * modest on paper decides whether a rank is farmable or fatal.
       */
      function renderTiers() {
        const L = P.exampleLevel;
        const Lm = mobLevel(L);
        const secs = (T) => (T < 100 ? `${T.toFixed(1)}s` : `${T.toFixed(0)}s`);
        // Weakest first, so the columns read as a progression.
        const tiers = DATA.proposed.grades
          .map((g) => ({ ...g, p: player(L, g.grade) }))
          .reverse();
        const top = tiers[tiers.length - 1];

        const head = `<div class="panel" style="margin-bottom:12px">
          <div class="legend-h">THE THREE PLAYERS — level ${L}</div>
          ${table(
            [
              "player tier",
              "gear",
              "stat points spent",
              "HP",
              "atk",
              "def",
              "CombatScore",
              "relative strength",
            ],
            tiers.map((t) => {
              const b = DATA.proposed.builds.find((x) => x.build === t.build);
              return [
                `<b>${t.grade}</b>`,
                `${t.gear} <span class="dim">(×${DATA.proposed.gearTiers.find((x) => x.tier === t.gear).scale})</span>`,
                `${(b.alloc * 100).toFixed(0)}%`,
                n0(t.p.hp),
                n0(t.p.atk),
                n0(t.p.def),
                t.p.cs.toFixed(0),
                `${((t.p.cs / top.p.cs) * 100).toFixed(0)}%`,
              ];
            }),
          )}
          <div class="legend-b" style="margin-top:10px">
            CombatScore is the geometric mean, so a tier at <b>x%</b> of the top's CS meets
            every rank at <b>x³%</b> of its R. The strength column looks narrow; the outcome
            column below is not.
          </div>
        </div>`;

        const rows = DATA.proposed.ladder.map((rk) => {
          const m = mob(Lm, rk.rank);
          return [
            `<b>${rk.rank}</b>`,
            rk.shape === "boss"
              ? `${rk.n}v1 boss`
              : rk.n > 1
                ? `${rk.n}v${rk.n}`
                : "1v1",
            ...tiers.map((t) => {
              const r = R(L, rk.rank, t.grade, rk.n);
              const T = ttk(L, rk.rank, t.grade);
              const swings = t.p.hp / hit(m, t.p, L);
              return `${rCell(r)}
                <div class="dim" style="margin-top:4px;font-size:12px;line-height:1.5">
                  ${secs(T)} to kill<br />survives ${swings.toFixed(1)} swings<br />${
                    r > 1 ? `${hpLeft(r)} HP left` : "<b>you die</b>"
                  }
                </div>`;
            }),
          ];
        });

        return `${section(
          "Rank ladder ③ — the same ladder for all three player tiers",
          `Ladders ① and ② showed the <b>strongest</b> player only. Here is every rank against
           each tier, at level ${L} and the rank's own encounter shape.`,
        )}
        ${head}
        ${table(
          [
            "mob rank",
            "encounter",
            ...tiers.map((t) => `${t.gear} gear · ${t.build} build`),
          ],
          rows,
        )}
        <div class="banner warn" style="margin-top:12px">
          <b>The tier gap is squared, and it moves the whole ladder.</b> Read the columns
          against each other rather than down: the same rank is a different game per tier, and
          a rank that is comfortable for the top tier can be a loss two tiers down. Where a
          column reads <b>you die</b>, that rank is gated behind gear — it cannot be brute-forced
          by playing well, because nothing in this model represents playing well.
          <br /><br />
          <b>The gear scale is invented.</b> <code>weapons.ts</code> holds archetypes, not tiers;
          the 0.70 / 0.85 / 1.00 numbers are authored here and nowhere else. They are the input
          this whole table is most sensitive to and the one with the least behind it.
        </div>`;
      }

      function renderMatrix() {
        const { builds, gearTiers, grades, ladder } = DATA.proposed;
        const n = P.encounterSize;
        const named = (b, g) =>
          grades.find((x) => x.build === b && x.gear === g);
        const rows = [];
        for (const b of builds) {
          for (const g of gearTiers) {
            const nm = named(b.build, g.tier);
            rows.push([
              `<b>${b.build}</b>${nm ? ` <span class="dim">· ${nm.grade}</span>` : ""}`,
              g.tier,
              ...ladder.map((rk) =>
                rCell(
                  R(midLevel(rk), rk.rank, { build: b.build, gear: g.tier }, n),
                ),
              ),
            ]);
          }
        }
        return `${section(
          "Outcome matrix — who beats what",
          `Rows are the <b>player</b> (${builds.length} builds × ${gearTiers.length} gear tiers). Columns are the <b>mob</b> rank. Each cell is R for ${
            n <= 1
              ? "<b>one player against one mob</b> — the foundation"
              : `<b>${n} players against ${n} mobs</b>`
          }. ${
            P.mobLevelDelta
              ? "Header levels are the <b>mob's</b>, with yours beside them."
              : "Header levels do <b>not</b> affect any cell — R is the same at every level."
          }`,
        )}
        ${table(
          [
            "player build",
            "player gear",
            ...ladder.map(
              (rk) =>
                `vs ${rk.rank} mob · L${mobShownLevel(midLevel(rk))}` +
                (P.mobLevelDelta
                  ? ` <span class="dim">(you L${midLevel(rk)})</span>`
                  : ""),
            ),
          ],
          rows,
        )}`;
      }

      /**
       * The eight player groups: [gear class] x [gear tier] x [build focus].
       * Scored the way you asked — time to kill, and HP left over.
       */
      /**
       * The eight player groups: [gear class] x [gear tier] x [build focus].
       * Scored the way you asked — time to kill, and HP left over.
       */
      function renderArchetypes() {
        const { archetypes, archetypeRanks, ladder } = DATA.proposed;
        const n = P.encounterSize;
        const ranks = archetypeRanks.map((r) =>
          ladder.find((x) => x.rank === r),
        );
        const spec = (a) => ({
          build: "high",
          gear: a.gear,
          focus: a.focus,
          gearClass: a.gearClass,
        });
        // Level-invariant, so any reference level gives the same ratio.
        const cs = archetypes.map((a) => player(50, spec(a)).cs);
        const best = Math.max(...cs);

        const cell = (a, rk) => {
          const L = midLevel(rk);
          const r = R(L, rk.rank, spec(a), n);
          const t = ttk(L, rk.rank, spec(a));
          const left = (1 - 1 / r) * 100;
          return (
            `<span class="pill b-${band(r)}">${t < 100 ? t.toFixed(1) : t.toFixed(0)}s</span>` +
            `<div class="${left < 0 ? "FAIL" : "dim"}">${left >= 0 ? "+" : ""}${left.toFixed(0)}% HP left</div>`
          );
        };

        const rows = archetypes.map((a, i) => [
          `<b>${a.gearClass}</b> gear`,
          a.tier,
          a.focus,
          `${((cs[i] / best) * 100).toFixed(0)}%`,
          ...ranks.map((rk) => cell(a, rk)),
        ]);

        return `${section(
          "Eight player groups — time to kill, and what it costs you",
          `Rows are the <b>player</b>: gear class × gear tier × build focus, 2×2×2. All eight are
           <b>fully allocated</b> — "full DPS" and "full tank" are directions, not amounts.
           Columns are the <b>mob</b> rank, E through SS. Each cell is
           <b>time to kill</b> over <b>player HP left</b>, which is <code>100 − HP consumed</code>
           and <b>goes negative when the fight kills you</b>. ${
             n <= 1
               ? "One player, one mob."
               : `<b>${n} players against ${n} mobs.</b>`
           }
           SSS is omitted: it is the unresolved boss-or-pack rank.`,
        )}
        ${table(
          [
            "gear class",
            "gear tier",
            "build focus",
            "relative strength",
            ...ranks.map((rk) => `vs ${rk.rank} mob`),
          ],
          rows,
        )}`;
      }

      /**
       * One concrete level, every number spelled out. The rest of the page is
       * ratios; this is the only place you see an actual damage figure.
       */
      function renderExample() {
        const L = P.exampleLevel;
        const p = player(L, "max");
        const rows = DATA.proposed.ladder.map((rk) => {
          const m = mob(mobLevel(L), rk.rank);
          const yours = hit(p, m, mobLevel(L));
          const theirs = hit(m, p, L);
          // Encounter R, matching the rank's own shape. Using the 1v1 value for
          // a boss while showing the party's wall clock mixed two different
          // fights in one row — the storyboard made that obvious.
          const r = R(L, rk.rank, "max", rk.n);
          return [
            `<b>${rk.rank}</b>`,
            n0(m.atk),
            n0(m.def),
            n0(m.hp),
            n0(yours),
            `${n0(theirs)} <span class="dim">(${((theirs / p.hp) * 100).toFixed(1)}% of you)</span>`,
            (ttk(L, rk.rank, "max") * P.aspd).toFixed(1),
            `${ttk(L, rk.rank, "max").toFixed(1)}s`,
            // Intensity: how fast it drains you, independent of how long the
            // fight runs. 1/(R x ttk). This is the column that exposes a rank
            // being "hard" only by lasting longer.
            `${(100 / (r * ttk(L, rk.rank, "max"))).toFixed(2)}%/s`,
            rk.shape === "boss"
              ? `${rk.n}v1 boss`
              : rk.n > 1
                ? `${rk.n}v${rk.n}`
                : "1v1",
            rCell(r),
          ];
        });
        return `${section(
          `Worked example — a level ${L} player, every number spelled out`,
          `The rest of the page is ratios. This is the only place with actual damage figures.
           A <b>max-grade player at level ${L}</b>: atk <b>${n0(p.atk)}</b>, def <b>${n0(p.def)}</b>,
           HP <b>${n0(p.hp)}</b>. One hit is <code>k × refHp(${L}) × atk/def</code> with
           k = <b>${P.k}</b> and refHp(${L}) = <b>${n0(refHp(L))}</b>.
           Drag <code>Worked example level</code> to move it.`,
        )}
        ${table(
          [
            "mob rank",
            "mob atk",
            "mob def",
            "mob HP",
            "you hit for",
            "it hits you for",
            "swings each",
            "time to kill",
            "danger per second",
            "encounter",
            "R",
          ],
          rows,
        )}`;
      }

      /**
       * The same fights as a storyboard. Every other section is a number; this
       * is what the number looks like while it happens.
       *
       * Both bars drain linearly — damage per second is constant on both sides —
       * so the last panel lands on 1 - 1/R by construction, the same health left
       * the tables report.
       */
      function renderStoryboard() {
        const L = P.exampleLevel;
        const STEPS = 6;
        const rows = DATA.proposed.ladder
          .map((rk) => {
            const T = ttk(L, rk.rank, "max");
            const r = R(L, rk.rank, "max", rk.n);
            const drain = 100 / (r * T); // your health bar, % per second
            const panels = Array.from({ length: STEPS }, (_, i) => {
              const t = (T * i) / (STEPS - 1);
              const you = Math.max(0, 100 - drain * t);
              const mob = Math.max(0, 100 * (1 - t / T));
              const tone = you > 60 ? "" : you > 25 ? " hurt" : " dying";
              return `<div class="sb-panel">
                <div class="sb-t">${t < 10 ? t.toFixed(1) : t.toFixed(0)}s${i === STEPS - 1 ? " · end" : ""}</div>
                <div class="sb-bar sb-you${tone}"><i style="width:${you.toFixed(1)}%"></i></div>
                <div class="sb-bar sb-mob"><i style="width:${mob.toFixed(1)}%"></i></div>
                <div class="sb-n"><span>you ${you.toFixed(0)}%</span><span>${rk.shape === "boss" ? "boss" : "mob"} ${mob.toFixed(0)}%</span></div>
              </div>`;
            }).join("");
            return `<div class="sb-row">
              <div class="sb-label"><b>${rk.rank}</b>
                <span>${rk.shape === "boss" ? `${rk.n}v1 boss` : rk.n > 1 ? `${rk.n}v${rk.n}` : "1v1"}</span>
                <span>${T < 100 ? T.toFixed(1) : T.toFixed(0)}s · ${(T * P.aspd).toFixed(0)} swings</span>
              </div>${panels}</div>`;
          })
          .join("");
        return `${section(
          `Storyboard — how each fight actually runs, at level ${P.exampleLevel}`,
          `Six moments through every rank, from the opening swing to the kill.
           <b class="PASS">Green</b> is your health, <b style="color:var(--accent)">blue</b> is the mob's.
           Both drain at a constant rate, so the final panel is exactly the health the tables say you finish on.
           Packs are drawn as one representative fight; bosses show the party's wall clock.`,
        )}
        <div class="panel">${rows}</div>`;
      }

      function renderCurve() {
        const rows = [1, 20, 40, 60, 80, P.levelMax].map((L) => {
          const p = player(L, "max");
          return [
            L,
            n0(p.cs),
            n0(p.atk),
            n0(p.hp),
            n0(p.def),
            p.mspdRaw > P.mspdCap
              ? `<span class="FAIL">${p.mspd.toFixed(1)} clamped</span>`
              : p.mspd.toFixed(1),
          ];
        });
        return `${section(
          "Player curve — what a PLAYER looks like at each level",
          "No mobs here. A max-grade player at each level. † Move speed is <b>constant at every level by design</b> — it has no level term. Making it grow with level is a change to the model, not a tuning value.",
        )}
        ${table(
          [
            "player level",
            "player CS",
            "player atk",
            "player maxHP",
            "player def",
            "player move speed †",
          ],
          rows,
        )}
        ${sparkline()}`;
      }

      /** CS vs level per grade. Log-y — CS spans ~75× over 99 levels. */
      function sparkline() {
        const W = 720,
          H = 200,
          PAD = 34;
        const colors = { max: "#7c9eff", median: "#7ee787", min: "#f2b84b" };
        const grades = DATA.proposed.grades.map((g) => g.grade);
        const all = grades.flatMap((g) => {
          const out = [];
          for (let L = 1; L <= P.levelMax; L++) out.push(player(L, g).cs);
          return out;
        });
        const lo = Math.log(Math.min(...all)),
          hi = Math.log(Math.max(...all));
        const x = (L) => PAD + ((L - 1) / (P.levelMax - 1)) * (W - PAD - 8);
        const y = (cs) =>
          H - PAD - ((Math.log(cs) - lo) / (hi - lo || 1)) * (H - PAD - 10);
        const paths = grades
          .map((g) => {
            let d = "";
            for (let L = 1; L <= P.levelMax; L++)
              d += `${L === 1 ? "M" : "L"}${x(L).toFixed(1)},${y(player(L, g).cs).toFixed(1)} `;
            return `<path d="${d}" fill="none" stroke="${colors[g]}" stroke-width="1.8"/>`;
          })
          .join("");
        const legend = grades
          .map(
            (g, i) =>
              `<text x="${PAD + 8 + i * 76}" y="16" fill="${colors[g]}" font-size="11">■ ${g}</text>`,
          )
          .join("");
        const ticks = [1, 25, 50, 75, P.levelMax]
          .map(
            (L) =>
              `<text x="${x(L)}" y="${H - 12}" fill="#656d80" font-size="10" text-anchor="middle">${L}</text>`,
          )
          .join("");
        return `<div class="panel" style="margin-top:12px">
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${legend}${paths}${ticks}
            <text x="4" y="${y(Math.exp(hi))}" fill="#656d80" font-size="10">${n0(Math.exp(hi))}</text>
            <text x="4" y="${y(Math.exp(lo))}" fill="#656d80" font-size="10">${n0(Math.exp(lo))}</text>
          </svg>
          <div class="meta">CombatScore vs level (log scale)</div></div>`;
      }

      function renderMobs() {
        const n = P.encounterSize;
        const rows = DATA.proposed.ladder.map((rk) => {
          const L = midLevel(rk),
            Lm = mobLevel(L),
            Ls = mobShownLevel(L);
          const m = mob(Lm, rk.rank);
          const t1 = ttk(L, rk.rank, "max") / n;
          return [
            `<b>${rk.rank}</b>`,
            L,
            Ls === L ? Ls : `<span class="FAIL">${Ls}</span>`,
            `${rk.swings}`,
            m.atkMult.toFixed(4),
            m.defMult.toFixed(3),
            n0(m.cs),
            n0(m.hp),
            n0(m.atk),
            n0(m.def),
            `${t1.toFixed(1)}s`,
            `${(t1 * n).toFixed(0)}s`,
          ];
        });
        return `${section(
          "Mob stats — what a MOB looks like at each rank",
          `One row per <b>mob</b> rank. Each rank has <b>three</b> multipliers — atk, def and hp — solved live so it hits its target R <b>and</b> its target fight length. Each rank is set by two targets — how hard (<b>R</b>) and how fast it drains you (<b>danger</b>) — and its fight length is derived from the pair. The two time columns are for a party of <b>${n}</b> max-grade players.`,
        )}
        ${table(
          [
            "mob rank",
            "player level",
            "mob level",
            "target swings to kill you",
            "mob atk mult",
            "mob def/hp mult",
            "mob CS",
            "mob HP",
            "mob atk",
            "mob def",
            "time to kill 1 mob",
            "time to clear pack",
          ],
          rows,
        )}`;
      }

      function renderInvariants() {
        const inv = invariants();
        const all = inv.every(([, , ok]) => ok);
        return `${section(
          "Invariants — does the MODEL itself hold up",
          "Not about any player or mob. Structural properties the model must satisfy at every level; a FAIL means the current settings broke the design.",
        )}
        <div class="banner ${all ? "ok" : "bad"}">${all ? "ALL PASS" : "SOME FAILED"}</div>
        ${table(
          ["invariant", "value", "result"],
          inv.map(([n, v, ok]) => [
            n,
            v,
            `<span class="${ok ? "PASS" : "FAIL"}">${ok ? "PASS" : "FAIL"}</span>`,
          ]),
        )}`;
      }

      function renderGlossary() {
        const rows = Object.entries(TERMS).map(([k, [full, desc]]) => [
          `<b>${k}</b>`,
          full,
          `<span class="dim">${desc}</span>`,
        ]);
        return `${section(
          "Glossary",
          "Every abbreviation used above. Column headers carry the same text as a hover tooltip.",
        )}
        <div class="scroll"><table class="gloss-t"><thead><tr><th>as shown</th><th>full name</th><th>meaning</th></tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td class="gloss">${c}</td>`).join("")}</tr>`).join("")}</tbody>
        </table></div>`;
      }

      function renderNotes() {
        return `${section("Not covered here", "Read these before treating any verdict above as final.")}
        <ul class="notes">
          <li>Closed-form only — no crit variance, misses, kiting or movement; perfect focus-fire assumed.
              A <code>BattleModule</code> run is what would turn this from a model into evidence.</li>
          ${DATA.proposed.openQuestions.map((q) => `<li>${q}</li>`).join("")}
        </ul>
        ${section("Provenance", "Where the numbers come from.")}
        <ul class="notes">
          <li>Everything here comes from <code>combat-model.json</code>, generated by
              <code>scripts/gen_combat_model.mjs</code>. That file holds the model and nothing else — it does
              not read the game's source. Reconciling the model with what ships is a separate, later job.</li>
          <li>Mirrors <code>${DATA.proposed.reference}</code>; <code>verify.mjs</code> asserts they agree.</li>
          <li>Spec: <code>${DATA.proposed.spec}</code></li>
        </ul>`;
      }

      function renderAll() {
        document.getElementById("app").innerHTML = [
          renderLegend(),
          renderInputs(),
          renderRequirements(),
          renderLadder(),
          renderTiers(),
          renderMatrix(),
          renderArchetypes(),
          renderExample(),
          renderStoryboard(),
          renderCurve(),
          renderMobs(),
          renderInvariants(),
          renderGlossary(),
          renderNotes(),
        ].join("");
        wire();
      }

      function wire() {
        for (const input of document.querySelectorAll('input[type="range"]')) {
          input.addEventListener("input", (e) => {
            P[e.target.dataset.key] = parseFloat(e.target.value);
            const id = e.target.id,
              pos = e.target.value;
            renderAll();
            const again = document.getElementById(id);
            if (again) {
              again.value = pos;
              again.focus();
            }
          });
        }
        for (const b of document.querySelectorAll("button.rule")) {
          b.addEventListener("click", (e) => {
            P.armourRule = e.target.dataset.rule;
            renderAll();
          });
        }
        document.getElementById("reset").addEventListener("click", () => {
          loadDefaults();
          renderAll();
        });
      }

      function loadDefaults() {
        P = { levelMax: DATA.proposed.levelMax };
        for (const [k, d] of Object.entries(DATA.proposed.inputs))
          P[k] = d.value;
        P.armourRule = DATA.proposed.armourRuleDefault;
      }

      fetch(`combat-model.json?v=${Date.now()}`) // regenerated often; never cache
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then((json) => {
          DATA = json;
          loadDefaults();
          document.getElementById("hdr").textContent =
            `generated ${json.generatedAt} · schema v${json.version} · ` +
            `the I-028 model only — nothing here is read from the game`;
          renderAll();
        })
        .catch(() => {
          document.getElementById("hdr").textContent = "load failed";
          document.getElementById("err").hidden = false;
        });
    </script>
  </body>
</html>
