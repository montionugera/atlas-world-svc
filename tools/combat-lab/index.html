<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas-world-svc — Combat Balance Lab</title>
    <style>
      :root {
        --bg: #0b0d12;
        --bg-elev: #12151d;
        --bg-card: #171b26;
        --border: #262c3a;
        --border-hover: #3a4256;
        --text: #e7e9ee;
        --text-dim: #9aa1b2;
        --text-faint: #656d80;
        --accent: #7c9eff;
        --accent-dim: #3a4a7a;
        --ok: #7ee787;
        --err: #ff7b72;
        --warn: #f2b84b;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;

        --loss: #ff7b72;
        --brutal: #ff9f6e;
        --hard: #f2b84b;
        --fair: #7ee787;
        --easy: #56d4dd;
        --trivial: #7c9eff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      h2 {
        margin: 32px 0 12px;
        font-size: 15px;
        color: var(--text);
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      h2 .sub {
        font-size: 12px;
        color: var(--text-faint);
        font-weight: 400;
      }
      main {
        padding: 0 24px 80px;
        max-width: 1400px;
      }
      .meta {
        font-size: 12px;
        color: var(--text-faint);
        font-family: var(--mono);
      }
      a {
        color: var(--accent);
      }

      .panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .grid-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px 20px;
      }
      .input-row label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .input-row label b {
        font-family: var(--mono);
        color: var(--accent);
        font-weight: 600;
      }
      .input-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      button {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 6px;
        padding: 6px 12px;
        font-family: var(--sans);
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      th,
      td {
        text-align: right;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        color: var(--text-faint);
        font-weight: 500;
        text-align: right;
        font-family: var(--sans);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tbody tr:hover {
        background: #ffffff06;
      }
      .scroll {
        overflow-x: auto;
      }

      .pill {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--sans);
      }
      .b-LOSS {
        background: #ff7b7222;
        color: var(--loss);
      }
      .b-brutal {
        background: #ff9f6e22;
        color: var(--brutal);
      }
      .b-hard {
        background: #f2b84b22;
        color: var(--hard);
      }
      .b-fair {
        background: #7ee78722;
        color: var(--fair);
      }
      .b-easy {
        background: #56d4dd22;
        color: var(--easy);
      }
      .b-trivial {
        background: #7c9eff22;
        color: var(--trivial);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left-width: 3px;
        border-radius: 6px;
        padding: 12px 14px;
      }
      .card.pass {
        border-left-color: var(--ok);
      }
      .card.fail {
        border-left-color: var(--err);
      }
      .card .req {
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .card .val {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 600;
      }
      .card .verdict {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .card.pass .verdict {
        color: var(--ok);
      }
      .card.fail .verdict {
        color: var(--err);
      }
      .card .bound {
        font-size: 11px;
        color: var(--text-faint);
        font-family: var(--mono);
      }

      .banner {
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        margin: 12px 0;
        border: 1px solid;
      }
      .banner.ok {
        background: #7ee7870f;
        border-color: #7ee78744;
        color: var(--ok);
      }
      .banner.bad {
        background: #ff7b720f;
        border-color: #ff7b7244;
        color: var(--err);
      }
      .banner.info {
        background: #7c9eff0f;
        border-color: #7c9eff44;
        color: var(--text-dim);
      }

      .PASS {
        color: var(--ok);
        font-weight: 600;
      }
      .FAIL {
        color: var(--err);
        font-weight: 600;
      }
      .dim {
        color: var(--text-faint);
      }
      /* One-line statement of what a table answers, directly under its title. */
      .qline {
        color: var(--text-dim);
        font-size: 13px;
        margin: -6px 0 12px;
      }
      .qline b {
        color: var(--text);
        font-weight: 600;
      }
      .legend-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      .legend-h {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 4px;
      }
      .legend-b {
        font-size: 13px;
        color: var(--text-dim);
      }
      /* Signals "hover me" — every documented header carries a tooltip. */
      .term {
        border-bottom: 1px dotted var(--text-faint);
        cursor: help;
      }
      .term:hover {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .gloss-t th {
        text-align: left;
      }
      td.gloss {
        text-align: left;
        white-space: normal;
        font-family: var(--sans);
        font-size: 13px;
      }
      td.gloss:first-child {
        font-family: var(--mono);
        font-size: 12px;
        white-space: nowrap;
      }
      ul.notes {
        color: var(--text-dim);
        font-size: 13px;
        padding-left: 20px;
      }
      ul.notes li {
        margin-bottom: 6px;
      }
      code {
        font-family: var(--mono);
        background: #ffffff0d;
        padding: 1px 5px;
        border-radius: 3px;
      }
      #err {
        padding: 40px 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        Combat Balance Lab
        <span class="dim" style="font-weight: 400">— I-028</span>
      </h1>
      <div class="meta" id="hdr">loading…</div>
    </header>
    <main id="app"></main>
    <div id="err" hidden>
      <div class="banner bad">
        <b>Could not load <code>combat-model.json</code>.</b><br />
        Browsers block <code>fetch()</code> over <code>file://</code>. Serve the
        folder instead:<br /><br />
        <code
          >node scripts/gen_combat_model.mjs &amp;&amp; (cd tools/combat-lab
          &amp;&amp; python3 -m http.server 842)</code
        ><br /><br />
        then open <a href="http://localhost:842/">http://localhost:842/</a>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- model
      // Mirrors model/balance_sheet.py. Every number on this page is derived
      // here from combat-model.json — nothing is hand-typed into the markup.

      let DATA = null; // parsed combat-model.json
      let P = {}; // live tunable inputs (proposed.inputs.*.value, slider-editable)
      let crossSolo = true; // outcome matrix: 1v1 by default, toggles to party

      const grow = (L) => Math.pow(P.growth, L - 1);
      /** Defence constant that keeps mitigation % flat across levels. */
      const kAnchor = () =>
        (P.def1 * (1 - P.targetReduction)) / P.targetReduction;

      /**
       * Resolve a player spec to its two independent axes. Accepts either
       * {build, gear} or a legacy grade name ("max"/"median"/"min"), which is
       * just a named point on the build x gear diagonal.
       */
      function resolve(spec) {
        const s =
          typeof spec === "string"
            ? DATA.proposed.grades.find((x) => x.grade === spec)
            : spec;
        const b = DATA.proposed.builds.find((x) => x.build === s.build);
        const g = DATA.proposed.gearTiers.find((x) => x.tier === s.gear);
        return { alloc: b.alloc, gearScale: g.scale };
      }

      function player(L, spec) {
        const { alloc, gearScale } = resolve(spec);
        const f = grow(L),
          C = P.statCoef,
          a = alloc,
          gs = gearScale;
        const dps = ((P.dps1 * f) / (1 + C)) * (1 + C * a) * gs;
        const hp = ((P.hp1 * f) / (1 + C)) * (1 + C * a) * gs;
        const dfn = P.def1 * f * gs;
        const red = dfn / (dfn + kAnchor() * f);
        const ehp = hp / (1 - red);
        return {
          dps,
          hp,
          ehp,
          red,
          pDef: dfn,
          mDef: dfn,
          cs: Math.sqrt(dps * ehp),
          pAtk: (dps * P.physMix) / P.aspd,
          mAtk: (dps * (1 - P.physMix)) / P.castRate,
          mspd: Math.min(P.mspdBase * (1 + C * a), P.mspdCap),
          mspdRaw: P.mspdBase * (1 + C * a),
        };
      }

      /** A rank's mob is the max-grade player at that level, scaled by `mult`. */
      function mob(L, rank) {
        const r = DATA.proposed.ladder.find((x) => x.rank === rank);
        const ref = player(L, "max");
        const s = (v) => v * r.mult;
        return {
          n: r.n,
          mult: r.mult,
          cs: s(ref.cs),
          dps: s(ref.dps),
          ehp: s(ref.ehp),
          hp: s(ref.hp),
          pAtk: s(ref.pAtk),
          pDef: s(ref.pDef),
        };
      }

      /**
       * R = how long you survive / how long the encounter survives. R>1 = win.
       * Single duel collapses to (CS_p/CS_m)^2 — CS is the sufficient statistic,
       * the DPS/EHP split cancels. Headcount reading is "n mobs AND n players",
       * so Lanchester's +n^2 (focus fire) and -n(n+1)/2 (pack dies one at a
       * time) nearly cancel, leaving 2n/(n+1).
       */
      /** Mob level is player level plus the offset — rank does not fix a level. */
      const mobLevel = (L) =>
        Math.max(1, Math.min(P.levelMax, L + (P.mobLevelDelta || 0)));

      function R(L, rank, spec, solo) {
        const p = player(L, spec),
          m = mob(mobLevel(L), rank);
        const single = Math.pow(p.cs / m.cs, 2);
        return solo ? single : (single * 2 * m.n) / (m.n + 1);
      }

      function band(r) {
        for (const b of DATA.proposed.bands)
          if (b.max === null || r < b.max) return b.name;
        return "trivial";
      }
      const hpLeft = (r) =>
        r > 1 ? `${((1 - 1 / r) * 100).toFixed(0)}%` : "—";
      const midLevel = (rk) => Math.floor((rk.from + rk.to) / 2);

      // ----------------------------------------------------------- invariants
      function invariants() {
        const C = P.statCoef,
          G = P.growth;
        const reds = [];
        for (let L = 1; L <= P.levelMax; L++) reds.push(player(L, "max").red);
        const statShare = C / (1 + C); // provably flat: CS scales by (1+C*alloc)
        const sss = DATA.proposed.ladder[DATA.proposed.ladder.length - 1];
        const biggestHp = mob(sss.to, sss.rank).hp * sss.n;
        const reqs = requirements();
        const capAtMax = P.mspdBase * (1 + C * 1.0);

        return [
          [
            "20-level growth in 120–160%",
            `${((Math.pow(G, 20) - 1) * 100).toFixed(0)}%`,
            Math.pow(G, 20) - 1 >= 1.2 && Math.pow(G, 20) - 1 <= 1.6,
          ],
          [
            "CS compounds at the growth rate",
            `${((player(2, "max").cs / player(1, "max").cs - 1) * 100).toFixed(2)}%`,
            Math.abs(player(2, "max").cs / player(1, "max").cs - G) < 1e-9,
          ],
          [
            "mitigation % flat across levels",
            `${(reds[0] * 100).toFixed(0)}%`,
            Math.max(...reds) - Math.min(...reds) < 1e-9,
          ],
          [
            "stat share ≥25% at every level",
            `${(statShare * 100).toFixed(1)}% flat`,
            statShare >= 0.25,
          ],
          [
            "stat cap never exceeds 99",
            `${DATA.proposed.statCapAtLMax}`,
            DATA.proposed.statCapAtLMax <= 99,
          ],
          [
            "largest encounter HP fits int32",
            biggestHp.toLocaleString(undefined, { maximumFractionDigits: 0 }),
            biggestHp < 2 ** 31,
          ],
          [
            "all four requirements",
            `${reqs.filter((r) => r.ok).length}/${reqs.length}`,
            reqs.every((r) => r.ok),
          ],
          [
            `move speed within clamp ${P.mspdCap}`,
            capAtMax.toFixed(1),
            capAtMax <= P.mspdCap,
          ],
          // Pure exponential growth means CS_p/CS_m has no L in it. If this ever
          // fails, some term stopped scaling with the level curve.
          (() => {
            const rs = [1, 25, 50, 75, P.levelMax].map((L) =>
              R(L, "C", "max", false),
            );
            const spread = Math.max(...rs) - Math.min(...rs);
            return [
              "R invariant to absolute level",
              `${rs[0].toFixed(4)} at every level`,
              spread < 1e-9,
            ];
          })(),
        ];
      }

      function requirements() {
        return DATA.proposed.requirements.map((q) => {
          const r = R(q.level, q.rank, q.grade, q.solo);
          return { ...q, r, band: band(r), ok: r >= q.min && r < q.max };
        });
      }

      // -------------------------------------------------------------- render
      const el = (h) => {
        const d = document.createElement("div");
        d.innerHTML = h;
        return d.firstElementChild;
      };
      const n0 = (v) =>
        v.toLocaleString(undefined, { maximumFractionDigits: 0 });
      const rCell = (r) =>
        `<span class="pill b-${band(r)}">${r.toFixed(2)} ${band(r)}</span>`;

      /**
       * Every abbreviation on the page, defined once. Keys are the exact header
       * strings passed to table(), so a header with no entry here renders plain
       * and is immediately obvious as undocumented.
       */
      const TERMS = {
        "mob rank": [
          "Mob rank",
          "Content tier, E through SSS. Sets how strong one mob is RELATIVE to a same-level player. It does not imply a level.",
        ],
        "encounter size (n)": [
          "Encounter size",
          "The number of mobs AND the number of players — both. Rank S at n=8 means 8 players fighting 8 mobs, not one player against 8.",
        ],
        "mob CS ÷ player CS": [
          "Rank multiplier",
          "The mob's CombatScore as a fraction of a max-grade same-level player's. 0.5 means the mob is half as strong as you; 1.05 means slightly stronger.",
        ],
        was: [
          "Previous multiplier",
          "What this rank's multiplier was before I-028. Shown for comparison only — no calculation uses it.",
        ],
        "R · party of n": [
          "R for the full encounter",
          "n players against n mobs. Equals the 1v1 value times 2n/(n+1).",
        ],
        "R · 1v1": ["R for a single duel", "One player against one mob."],
        "player HP left": [
          "Player HP remaining",
          "The share of your health pool left when the fight ends, equal to 1 − 1/R. Blank when you lose.",
        ],
        "player build": [
          "Stat allocation completeness",
          "How fully the player spent their stat points: low 0.4, mid 0.7, high 1.0.",
        ],
        "player gear": [
          "Equipment tier",
          "E, C or A. NOTE: gear tiers do not exist in the game yet — this scale is authored design data.",
        ],
        "player level": ["Player level", "1 to 99."],
        "mob level": [
          "Mob level",
          "Independent of rank. Equals the player's level unless you set an offset; shown red when it differs.",
        ],
        "player CS": [
          "CombatScore",
          "√(DPS × EHP). The single number that decides a 1v1 — the split between damage and survivability cancels out.",
        ],
        "mob CS": ["Mob CombatScore", "√(DPS × EHP) for one mob."],
        "player pAtk": ["Physical attack", "Physical damage per hit."],
        "player mAtk": ["Magic attack", "Magic damage per cast."],
        "player pDef": [
          "Physical defence",
          "Feeds mitigation via pDef / (pDef + K), where K rides the same level curve.",
        ],
        "mob pAtk": ["Mob physical attack", "Physical damage per hit."],
        "mob pDef": [
          "Mob physical defence",
          "Same mitigation formula as the player.",
        ],
        "player maxHP": [
          "Maximum health",
          "Raw health pool, before mitigation.",
        ],
        "mob HP": ["Mob maximum health", "Raw health pool, before mitigation."],
        "damage mitigated †": [
          "Damage reduction",
          "Share of incoming damage absorbed. Constant at every level by design — K(L) grows at the same rate as pDef.",
        ],
        "player EHP": [
          "Effective health",
          "maxHP ÷ (1 − mitigation). How much raw damage it actually takes to kill you.",
        ],
        "player move speed †": [
          "Movement speed",
          "World units per second. Has no level term at all — a level 99 player moves as fast as a level 1 with the same allocation.",
        ],
        "time to kill 1 mob": [
          "Time to kill one mob",
          "Seconds for the party of n to focus down a single mob. Level-invariant.",
        ],
        "time to clear pack": [
          "Time to clear the encounter",
          "Seconds for the party of n to kill all n mobs.",
        ],
        "shipped maxHP": [
          "Maximum health, as the game ships today",
          "From the live additive formula in derivedStats.ts.",
        ],
        "shipped pAtk": [
          "Physical attack, as the game ships today",
          "Live additive formula, assuming str equals the player's level.",
        ],
        "shipped pDef": [
          "Physical defence, as the game ships today",
          "Live additive formula, assuming vit equals the player's level.",
        ],
        "shipped move speed": [
          "Movement speed, as the game ships today",
          "20 + 0.2 × agi, reaching 39.8 at the stat cap — above the proposed clamp of 36.",
        ],
        "proposed maxHP": [
          "Maximum health under I-028",
          "What the multiplicative model would give a max-grade player. Not in the game.",
        ],
        "proposed pAtk": [
          "Physical attack under I-028",
          "What the multiplicative model would give a max-grade player. Not in the game.",
        ],
        "proposed pDef": [
          "Physical defence under I-028",
          "What the multiplicative model would give a max-grade player. Not in the game.",
        ],
        "proposed move speed": [
          "Movement speed under I-028",
          "Clamped at 36 so a body cannot cross the collision capture band in one tick.",
        ],
        invariant: [
          "Structural property",
          "Something the model must satisfy regardless of tuning. A FAIL means the current slider settings broke the design.",
        ],
      };

      /** Header cell: dotted underline + native tooltip when the term is known. */
      function th(h) {
        const key = String(h)
          .replace(/<[^>]*>/g, "")
          .trim();
        const t = TERMS[key];
        if (!t) return `<th>${h}</th>`;
        return `<th><span class="term" title="${t[0]} — ${t[1]}">${h}</span></th>`;
      }

      /** Rendered at the foot of the page, because tooltips do not exist on touch. */
      function renderGlossary() {
        const rows = Object.entries(TERMS).map(([k, [full, desc]]) => [
          `<b>${k}</b>`,
          full,
          `<span class="dim">${desc}</span>`,
        ]);
        return `${section(
          "Glossary",
          "Every abbreviation used above. Column headers on this page carry the same text as a hover tooltip.",
        )}
        <div class="scroll"><table class="gloss-t"><thead><tr><th>as shown</th><th>full name</th><th>meaning</th></tr></thead>
        <tbody>${rows
          .map(
            (r) =>
              `<tr>${r.map((c) => `<td class="gloss">${c}</td>`).join("")}</tr>`,
          )
          .join("")}</tbody></table></div>`;
      }

      function table(headers, rows) {
        return `<div class="scroll"><table><thead><tr>${headers
          .map(th)
          .join("")}</tr></thead><tbody>${rows
          .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`)
          .join("")}</tbody></table></div>`;
      }

      /**
       * Every section states, in one line, what question its table answers and
       * which actor each axis belongs to. "Rank" alone is ambiguous — it means
       * the MOB's rank here and nothing else on the page uses that word.
       */
      function section(title, question) {
        return `<h2>${title}</h2>
          <div class="qline">${question}</div>`;
      }

      /** Who is who, and how to read a coloured pill. Shown once, up top. */
      function renderLegend() {
        const bands = DATA.proposed.bands
          .map(
            (b) =>
              `<span class="pill b-${b.name}">${b.name}</span> ${
                b.max === null ? "≥ 8" : `&lt; ${b.max}`
              }`,
          )
          .join(" · ");
        return `${section(
          "How to read this page",
          "Three things vary: the <b>player</b> (level, build, gear), the <b>mob</b> (rank, level, how many), and the <b>encounter</b> (solo or party).",
        )}
        <div class="panel">
          <div class="legend-grid">
            <div>
              <div class="legend-h">PLAYER</div>
              <div class="legend-b"><code>build</code> = how completely stat points were spent (low/mid/high).
              <code>gear</code> = equipment tier (E/C/A). <code>L</code> = player level, 1–${P.levelMax}.
              <code>CS</code> = CombatScore = <code>√(DPS × EHP)</code>.</div>
            </div>
            <div>
              <div class="legend-h">MOB</div>
              <div class="legend-b"><code>rank</code> = E → SSS, the content tier. Each rank owns a level band and a
              headcount <code>n</code>. A mob has its own <b>level</b>, independent of rank — rank sets how strong it
              is <i>relative to a same-level player</i>, level sets absolute power. The
              <code>Mob level − player level</code> slider offsets it; at 0 every fight is same-level.
              A mob's stats are the max-grade player at the <b>mob's</b> level times the rank's
              <code>mult</code>.</div>
            </div>
            <div>
              <div class="legend-h">OUTCOME — R</div>
              <div class="legend-b"><code>R</code> = how long the <b>player</b> survives ÷ how long the
              <b>encounter</b> survives. <code>R &gt; 1</code> = player wins, and <code>1 − 1/R</code> is the
              player's HP at the end. For 1v1 it equals <code>(CS_player / CS_mob)²</code>.</div>
            </div>
          </div>
          <div class="legend-h" style="margin-top:14px">BANDS</div>
          <div class="legend-b">${bands}</div>
        </div>`;
      }

      function renderInputs() {
        const defs = DATA.proposed.inputs;
        return `${section(
          "Inputs — the knobs",
          "These drive <b>both</b> the player and the mobs, since a mob is defined as a scaled copy of the max-grade player. Every table below recomputes live.",
        )}
        <div class="panel grid-inputs">${Object.entries(defs)
          .map(
            ([k, d]) => `<div class="input-row">
              <label for="in-${k}">${d.label} <b id="lbl-${k}">${P[k]}</b></label>
              <input type="range" id="in-${k}" data-key="${k}"
                     min="${d.min}" max="${d.max}" step="${d.step}" value="${P[k]}" />
            </div>`,
          )
          .join("")}</div>
        <div style="margin-top:10px"><button id="reset">Reset to spec defaults</button></div>`;
      }

      function renderRequirements() {
        const reqs = requirements();
        const all = reqs.every((r) => r.ok);
        return `${section(
          "Requirements — the four outcomes you specified",
          "Each card fixes a <b>player</b> grade, a <b>mob</b> rank and a level, then checks R lands in the band you asked for.",
        )}
        <div class="banner ${all ? "ok" : "bad"}">${
          all ? "ALL FOUR PASS" : `${reqs.filter((r) => !r.ok).length} FAILING`
        }</div>
        <div class="cards">${reqs
          .map(
            (q) => `<div class="card ${q.ok ? "pass" : "fail"}">
              <div class="req">${q.label}</div>
              <div class="val">${q.r.toFixed(2)} <span class="pill b-${q.band}">${q.band}</span></div>
              <div class="verdict">${q.ok ? "PASS" : "FAIL"}</div>
              <div class="bound">needs ${q.min} ≤ R &lt; ${q.max} · L${q.level} ${q.rank} ${q.grade} ${
                q.solo ? "solo" : "party"
              }</div>
            </div>`,
          )
          .join("")}</div>`;
      }

      function renderLadder() {
        const rows = DATA.proposed.ladder.map((rk) => {
          const L = midLevel(rk);
          const re = R(L, rk.rank, "max", false),
            rs = R(L, rk.rank, "max", true);
          return [
            `<b>${rk.rank}</b>`,
            rk.n,
            rk.mult.toFixed(3),
            `<span class="dim">${rk.was.toFixed(2)}</span>`,
            rCell(re),
            hpLeft(re),
            rCell(rs),
          ];
        });
        return `${section(
          "Rank ladder — how strong is each MOB tier",
          "One row per <b>mob</b> rank, measured against a <b>max-grade player</b> (high build, A gear). <b>n is the whole encounter</b> — n mobs <i>and</i> n players, so rank S means 8 players against 8 mobs. Level is absent on purpose: R is identical at level 1 and level 99, because player and mob grow at the same rate and absolute level cancels out. Only the <i>difference</i> between their levels matters.",
        )}
        ${table(
          [
            "mob rank",
            "encounter size (n)",
            "mob CS ÷ player CS",
            "was",
            "R · party of n",
            "player HP left",
            "R · 1v1",
          ],
          rows,
        )}`;
      }

      /**
       * The full cross-product: every build x gear combination against every
       * mob rank. Rows are 3 builds x 3 gear tiers; columns are the ranks, each
       * fought at its own mid-band level. The three grade names used by the
       * requirements are the diagonal, marked with a dot.
       */
      function renderMatrix() {
        const { builds, gearTiers, grades, ladder } = DATA.proposed;
        const diagonal = new Set(grades.map((g) => `${g.build}/${g.gear}`));
        const rows = [];
        for (const b of builds) {
          for (const g of gearTiers) {
            const key = `${b.build}/${g.tier}`;
            const named = grades.find(
              (x) => x.build === b.build && x.gear === g.tier,
            );
            rows.push([
              `<b>${b.build}</b>${
                diagonal.has(key)
                  ? ` <span class="dim">· ${named.grade}</span>`
                  : ""
              }`,
              g.tier,
              ...ladder.map((rk) =>
                rCell(
                  R(
                    midLevel(rk),
                    rk.rank,
                    { build: b.build, gear: g.tier },
                    crossSolo,
                  ),
                ),
              ),
            ]);
          }
        }
        return `${section(
          "Outcome matrix — who beats what",
          `Rows are the <b>player</b> (${builds.length} builds × ${gearTiers.length} gear tiers). Columns are the <b>mob</b> rank. Each cell is R — ${
            crossSolo
              ? "one player against one mob"
              : "n players against n mobs"
          }. The level shown in each header is where that rank is normally met; ${
            P.mobLevelDelta
              ? "with a level offset set, it is the <b>mob's</b> level and your own is shown beside it"
              : "it does <b>not</b> affect any cell — R is the same at every level"
          }.`,
        )}
        <div style="margin-bottom:10px">
          <button id="cross-toggle">${
            crossSolo
              ? "showing SOLO — 1 player vs 1 mob"
              : "showing PARTY — n players vs n mobs"
          }</button>
          <span class="dim" style="font-size:12px;margin-left:8px">click to switch</span>
        </div>
        ${table(
          [
            "player build",
            "player gear",
            ...ladder.map(
              (rk) =>
                `vs ${rk.rank} mob · L${mobLevel(midLevel(rk))}` +
                (P.mobLevelDelta
                  ? ` <span class="dim">(you L${midLevel(rk)})</span>`
                  : ""),
            ),
          ],
          rows,
        )}`;
      }

      function renderCurve() {
        const levels = [1, 20, 40, 60, 80, P.levelMax];
        const rows = levels.map((L) => {
          const p = player(L, "max");
          return [
            L,
            n0(p.cs),
            n0(p.pAtk),
            n0(p.mAtk),
            n0(p.hp),
            n0(p.pDef),
            `${(p.red * 100).toFixed(0)}%`,
            n0(p.ehp),
            p.mspdRaw > P.mspdCap
              ? `<span class="FAIL">${p.mspd.toFixed(1)} clamped</span>`
              : p.mspd.toFixed(1),
          ];
        });
        return `${section(
          "Player curve — what a PLAYER looks like at each level",
          "No mobs here. One row per <b>player</b> level for a max-grade player (high build, A gear). <b>EHP</b> is effective HP — raw HP divided by what mitigation lets through. † Mitigation and move speed are <b>constant at every level by design</b> — mitigation because the defence constant rides the same curve as pDef, move speed because it has no level term at all. If you want either to grow with level, that is a change to the model, not a tuning value.",
        )}
        ${table(
          [
            "player level",
            "player CS",
            "player pAtk",
            "player mAtk",
            "player maxHP",
            "player pDef",
            "damage mitigated †",
            "player EHP",
            "player move speed †",
          ],
          rows,
        )}
        ${sparkline()}`;
      }

      /** CS vs level, one line per grade. Log-y — CS spans ~75x over 99 levels. */
      function sparkline() {
        const W = 720,
          H = 200,
          PAD = 34;
        const colors = { max: "#7c9eff", median: "#7ee787", min: "#f2b84b" };
        const grades = DATA.proposed.grades.map((g) => g.grade);
        const all = grades.flatMap((g) => {
          const pts = [];
          for (let L = 1; L <= P.levelMax; L++) pts.push(player(L, g).cs);
          return pts;
        });
        const lo = Math.log(Math.min(...all)),
          hi = Math.log(Math.max(...all));
        const x = (L) => PAD + ((L - 1) / (P.levelMax - 1)) * (W - PAD - 8);
        const y = (cs) =>
          H - PAD - ((Math.log(cs) - lo) / (hi - lo || 1)) * (H - PAD - 10);
        const paths = grades
          .map((g) => {
            let d = "";
            for (let L = 1; L <= P.levelMax; L++)
              d += `${L === 1 ? "M" : "L"}${x(L).toFixed(1)},${y(player(L, g).cs).toFixed(1)} `;
            return `<path d="${d}" fill="none" stroke="${colors[g]}" stroke-width="1.8"/>`;
          })
          .join("");
        const legend = grades
          .map(
            (
              g,
              i,
            ) => `<text x="${PAD + 8 + i * 76}" y="16" fill="${colors[g]}" font-size="11"
                           font-family="var(--mono)">■ ${g}</text>`,
          )
          .join("");
        const ticks = [1, 25, 50, 75, P.levelMax]
          .map(
            (
              L,
            ) => `<text x="${x(L)}" y="${H - 12}" fill="#656d80" font-size="10"
                        text-anchor="middle" font-family="var(--mono)">${L}</text>`,
          )
          .join("");
        return `<div class="panel" style="margin-top:12px">
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">
            ${legend}${paths}${ticks}
            <text x="4" y="${y(Math.exp(hi))}" fill="#656d80" font-size="10" font-family="var(--mono)">${n0(Math.exp(hi))}</text>
            <text x="4" y="${y(Math.exp(lo))}" fill="#656d80" font-size="10" font-family="var(--mono)">${n0(Math.exp(lo))}</text>
          </svg>
          <div class="meta">CombatScore vs level (log scale)</div>
        </div>`;
      }

      function renderMobs() {
        const rows = DATA.proposed.ladder.map((rk) => {
          const L = midLevel(rk);
          const Lm = mobLevel(L);
          const p = player(L, "max"),
            m = mob(Lm, rk.rank);
          const ttk1 = m.ehp / (p.dps * m.n); // n players focusing one mob
          return [
            `<b>${rk.rank}</b>`,
            L,
            Lm === L ? Lm : `<span class="FAIL">${Lm}</span>`,
            m.n,
            n0(m.cs),
            n0(m.hp),
            n0(m.pAtk),
            n0(m.pDef),
            `${ttk1.toFixed(1)}s`,
            `${(ttk1 * m.n).toFixed(0)}s`,
          ];
        });
        return `${section(
          "Mob stats — what a MOB looks like at each rank",
          "One row per <b>mob</b> rank. <b>n is the encounter size</b> — n mobs and n players both. The two time columns are how long a party of n max-grade players takes to kill one mob, then to clear all n of them.",
        )}
        ${table(
          [
            "mob rank",
            "player level",
            "mob level",
            "encounter size (n)",
            "mob CS",
            "mob HP",
            "mob pAtk",
            "mob pDef",
            "time to kill 1 mob",
            "time to clear pack",
          ],
          rows,
        )}`;
      }

      function renderInvariants() {
        const inv = invariants();
        const all = inv.every(([, , ok]) => ok);
        return `${section(
          "Invariants — does the MODEL itself hold up",
          "Not about any player or mob. These are structural properties the whole model must satisfy at every level; a FAIL means the current slider settings broke the design, not that someone lost a fight.",
        )}
        <div class="banner ${all ? "ok" : "bad"}">${all ? "ALL PASS" : "SOME FAILED"}</div>
        ${table(
          ["invariant", "value", "result"],
          inv.map(([n, v, ok]) => [
            n,
            v,
            `<span class="${ok ? "PASS" : "FAIL"}">${ok ? "PASS" : "FAIL"}</span>`,
          ]),
        )}`;
      }

      /** What the game ships TODAY, so the design's drift is visible, not asserted. */
      function renderShipped() {
        const s = DATA.shipped,
          d = s.derivedStats,
          cap = s.statRange.max;
        const at = (lvl, stat) => ({
          maxHealth:
            d.maxHealth.base +
            d.maxHealth.perVit * stat +
            d.maxHealth.perLevel * (lvl - 1),
          pAtk: d.pAtk.base + d.pAtk.perStr * stat,
          pDef: d.pDef.base + stat,
          mspd: d.maxMoveSpeed.base + d.maxMoveSpeed.perAgi * stat,
        });
        const rows = [1, 50, 99].map((L) => {
          const a = at(L, Math.min(cap, L)); // stat tracks level as a rough stand-in
          const proposed = player(L, "max");
          return [
            L,
            n0(a.maxHealth),
            n0(a.pAtk),
            n0(a.pDef),
            a.mspd.toFixed(1),
            `<span class="dim">${n0(proposed.hp)}</span>`,
            `<span class="dim">${n0(proposed.pAtk)}</span>`,
            `<span class="dim">${n0(proposed.pDef)}</span>`,
            `<span class="dim">${proposed.mspd.toFixed(1)}</span>`,
          ];
        });
        const shippedCapMspd =
          d.maxMoveSpeed.base + d.maxMoveSpeed.perAgi * cap;
        return `${section(
          "Shipped vs proposed — TODAY's numbers next to the DESIGN's",
          `Left four columns are what the game ships right now, scraped live from ${Object.values(s.sources).length} config files. The grey primed columns are what I-028 would make them. Both describe a <b>player</b>; no mobs here. <b>Assumption:</b> the shipped rows assume every primary stat equals the player's level (capped at ${cap}) — the shipped formula is additive in raw stat values, so it needs a stat number and the game does not pin one to level. Treat the left half as illustrative, not as a measured player.`,
        )}
        <div class="banner info">
          Today the formula is <b>additive</b>:
          <code>pAtk = ${d.pAtk.base} + ${d.pAtk.perStr}·str + weapon</code>,
          <code>maxHealth = ${d.maxHealth.base} + ${d.maxHealth.perVit}·vit + ${d.maxHealth.perLevel}·(L−1)</code>,
          <code>mspd = ${d.maxMoveSpeed.base} + ${d.maxMoveSpeed.perAgi}·agi</code>.
          I-028 makes stats <b>multiply</b> gear instead. Grey columns are the proposal.
        </div>
        ${table(
          [
            "player level",
            "shipped maxHP",
            "shipped pAtk",
            "shipped pDef",
            "shipped move speed",
            "proposed maxHP",
            "proposed pAtk",
            "proposed pDef",
            "proposed move speed",
          ],
          rows,
        )}
        <div class="banner ${shippedCapMspd > P.mspdCap ? "bad" : "ok"}" style="margin-top:12px">
          Shipped move speed at stat cap ${cap} is <b>${shippedCapMspd.toFixed(1)}</b>
          (proposed clamp ${P.mspdCap}).
          ${
            shippedCapMspd > P.mspdCap
              ? `At ${shippedCapMspd.toFixed(1)} world-units/s with a ${s.game.tickRate}ms tick a body moves
                 ${((shippedCapMspd * s.game.tickRate) / 1000).toFixed(2)} units per step, past the
                 ${(2 * (s.physics.playerRadius + s.physics.projectileRadius)).toFixed(1)}-unit head-on capture band —
                 glancing hits tunnel. The fix is a 4× physics substep, not a lower coefficient.`
              : "Within the capture band."
          }
        </div>`;
      }

      function renderNotes() {
        return `${section(
          "Not covered here",
          "Known limits of this model. Read these before treating any verdict above as final.",
        )}
        <ul class="notes">
          <li>Closed-form only — no crit variance, misses, kiting; perfect focus-fire assumed.
              A <code>BattleModule</code> run is what turns this from a screen into proof.</li>
          ${DATA.proposed.openQuestions.map((q) => `<li>${q}</li>`).join("")}
        </ul>
        ${section("Provenance", "Where each number on this page came from.")}
        <ul class="notes">
          <li>Shipped values scraped by <code>scripts/gen_combat_model.mjs</code> from
              ${Object.values(DATA.shipped.sources)
                .map((f) => `<code>${f}</code>`)
                .join(", ")}.
              Re-run it after any combat config change.</li>
          <li>Proposed model authored in the same script; mirrors
              <code>${DATA.proposed.reference}</code>.</li>
          <li>Spec: <code>${DATA.proposed.spec}</code></li>
        </ul>`;
      }

      function renderAll() {
        document.getElementById("app").innerHTML = [
          renderLegend(),
          renderInputs(),
          renderRequirements(),
          renderLadder(),
          renderMatrix(),
          renderCurve(),
          renderMobs(),
          renderInvariants(),
          renderShipped(),
          renderGlossary(),
          renderNotes(),
        ].join("");
        wireInputs();
      }

      function wireInputs() {
        for (const input of document.querySelectorAll('input[type="range"]')) {
          input.addEventListener("input", (e) => {
            const k = e.target.dataset.key;
            P[k] = parseFloat(e.target.value);
            const focus = e.target.id,
              pos = e.target.value;
            renderAll();
            const again = document.getElementById(focus);
            if (again) {
              again.value = pos;
              again.focus();
            }
          });
        }
        document.getElementById("reset").addEventListener("click", () => {
          loadDefaults();
          renderAll();
        });
        document
          .getElementById("cross-toggle")
          .addEventListener("click", () => {
            crossSolo = !crossSolo;
            renderAll();
          });
      }

      function loadDefaults() {
        P = {};
        for (const [k, d] of Object.entries(DATA.proposed.inputs))
          P[k] = d.value;
        P.levelMax = DATA.proposed.levelMax;
      }

      fetch(`combat-model.json?v=${Date.now()}`) // regenerated often; never cache
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then((json) => {
          DATA = json;
          loadDefaults();
          document.getElementById("hdr").textContent =
            `generated ${json.generatedAt} · schema v${json.version} · ` +
            `shipped values scraped from source, proposed model from the I-028 spec`;
          renderAll();
        })
        .catch(() => {
          document.getElementById("hdr").textContent = "load failed";
          document.getElementById("err").hidden = false;
        });
    </script>
  </body>
</html>
