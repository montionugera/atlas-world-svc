<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas-world-svc — Combat Balance Lab</title>
    <style>
      :root {
        --bg: #0b0d12;
        --bg-elev: #12151d;
        --bg-card: #171b26;
        --border: #262c3a;
        --border-hover: #3a4256;
        --text: #e7e9ee;
        --text-dim: #9aa1b2;
        --text-faint: #656d80;
        --accent: #7c9eff;
        --ok: #7ee787;
        --err: #ff7b72;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        --loss: #ff7b72;
        --brutal: #ff9f6e;
        --hard: #f2b84b;
        --fair: #7ee787;
        --easy: #56d4dd;
        --trivial: #7c9eff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elev);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      h2 {
        margin: 34px 0 6px;
        font-size: 15px;
      }
      main {
        padding: 0 24px 80px;
        max-width: 1400px;
      }
      .meta {
        font-size: 12px;
        color: var(--text-faint);
        font-family: var(--mono);
      }
      a {
        color: var(--accent);
      }
      code {
        font-family: var(--mono);
        background: #ffffff0d;
        padding: 1px 5px;
        border-radius: 3px;
      }

      .panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
      }
      .qline {
        color: var(--text-dim);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .qline b {
        color: var(--text);
        font-weight: 600;
      }

      .grid-inputs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 14px 20px;
      }
      .input-row label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .input-row label b {
        font-family: var(--mono);
        color: var(--accent);
        font-weight: 600;
      }
      .input-row input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      button {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 6px;
        padding: 6px 12px;
        font-family: var(--sans);
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      th,
      td {
        text-align: right;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        color: var(--text-faint);
        font-weight: 500;
        font-family: var(--sans);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      tbody tr:hover {
        background: #ffffff06;
      }
      .scroll {
        overflow-x: auto;
      }
      .term {
        border-bottom: 1px dotted var(--text-faint);
        cursor: help;
      }
      .term:hover {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .pill {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--sans);
      }
      .b-LOSS {
        background: #ff7b7222;
        color: var(--loss);
      }
      .b-brutal {
        background: #ff9f6e22;
        color: var(--brutal);
      }
      .b-hard {
        background: #f2b84b22;
        color: var(--hard);
      }
      .b-fair {
        background: #7ee78722;
        color: var(--fair);
      }
      .b-easy {
        background: #56d4dd22;
        color: var(--easy);
      }
      .b-trivial {
        background: #7c9eff22;
        color: var(--trivial);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left-width: 3px;
        border-radius: 6px;
        padding: 12px 14px;
      }
      .card.pass {
        border-left-color: var(--ok);
      }
      .card.fail {
        border-left-color: var(--err);
      }
      .card .req {
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .card .val {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 600;
      }
      .card .verdict {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .card.pass .verdict {
        color: var(--ok);
      }
      .card.fail .verdict {
        color: var(--err);
      }
      .card .bound {
        font-size: 11px;
        color: var(--text-faint);
        font-family: var(--mono);
      }

      .banner {
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 13px;
        margin: 12px 0;
        border: 1px solid;
      }
      .banner.ok {
        background: #7ee7870f;
        border-color: #7ee78744;
        color: var(--ok);
      }
      .banner.bad {
        background: #ff7b720f;
        border-color: #ff7b7244;
        color: var(--err);
      }
      .banner.info {
        background: #7c9eff0f;
        border-color: #7c9eff44;
        color: var(--text-dim);
      }

      .PASS {
        color: var(--ok);
        font-weight: 600;
      }
      .FAIL {
        color: var(--err);
        font-weight: 600;
      }
      .dim {
        color: var(--text-faint);
      }
      .legend-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }
      .legend-h {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 4px;
      }
      .legend-b {
        font-size: 13px;
        color: var(--text-dim);
      }
      ul.notes {
        color: var(--text-dim);
        font-size: 13px;
        padding-left: 20px;
      }
      ul.notes li {
        margin-bottom: 6px;
      }
      .gloss-t th {
        text-align: left;
      }
      td.gloss {
        text-align: left;
        white-space: normal;
        font-family: var(--sans);
        font-size: 13px;
      }
      td.gloss:first-child {
        font-family: var(--mono);
        font-size: 12px;
        white-space: nowrap;
      }
      #err {
        padding: 40px 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        Combat Balance Lab
        <span class="dim" style="font-weight: 400">— I-028</span>
      </h1>
      <div class="meta" id="hdr">loading…</div>
    </header>
    <main id="app"></main>
    <div id="err" hidden>
      <div class="banner bad">
        <b>Could not load <code>combat-model.json</code>.</b><br />
        Browsers block <code>fetch()</code> over <code>file://</code>. Serve the
        folder:<br /><br />
        <code>cd tools/combat-lab &amp;&amp; python3 -m http.server 8421</code>
      </div>
    </div>

    <script>
      // ============================================================== model ==
      // The I-028 combat model. Nothing here reads the game — this is the
      // foundation on its own terms. Mirrors model/balance_sheet.py; verify.mjs
      // asserts the two agree.

      let DATA = null; // parsed combat-model.json
      let P = {}; // live tunable inputs, slider-editable

      const grow = (L) => Math.pow(P.growth, L - 1);

      /** Defence constant, riding the same curve as pDef so mitigation stays flat. */
      const kAnchor = () =>
        (P.def1 * (1 - P.targetReduction)) / P.targetReduction;

      /** Mob level is the player's plus an offset. Rank does not imply a level. */
      const mobLevel = (L) =>
        Math.max(1, Math.min(P.levelMax, L + (P.mobLevelDelta || 0)));

      /** The encounter size a rank's multiplier was originally solved against. */
      const rankRef = (rank) =>
        DATA.proposed.ladder.find((x) => x.rank === rank).n;

      /**
       * Resolve a player to its FOUR axes — two magnitudes and two directions.
       * Accepts {build, gear, focus, gearClass} or a legacy grade name, which is
       * just a named point on the build x gear diagonal.
       *
       * Both directions default to balanced, so anything that does not name them
       * reproduces the model exactly as it stood before they existed.
       */
      function resolve(spec) {
        const s =
          typeof spec === "string"
            ? DATA.proposed.grades.find((x) => x.grade === spec)
            : spec;
        const b = DATA.proposed.builds.find((x) => x.build === s.build);
        const g = DATA.proposed.gearTiers.find((x) => x.tier === s.gear);
        const f = s.focus
          ? DATA.proposed.focuses.find((x) => x.focus === s.focus)
          : null;
        const lean =
          s.gearClass === "dps"
            ? P.gearLean
            : s.gearClass === "tank"
              ? 1 - P.gearLean
              : 0.5;
        return {
          alloc: b.alloc,
          gearScale: g.scale,
          off: f ? f.off : 0.5,
          lean,
        };
      }

      function player(L, spec) {
        const { alloc: a, gearScale: gs, off, lean } = resolve(spec);
        const f = grow(L),
          C = P.statCoef;
        // Stat points: the (1 + C·a) bonus is SPLIT by focus. At off = 0.5 both
        // halves are exactly (1 + C·a) — the pre-focus model, unchanged.
        const atkStat = 1 + 2 * C * a * off;
        const defStat = 1 + 2 * C * a * (1 - off);
        // Gear: the TIER is how big the budget is, the CLASS is where it points.
        // At lean = 0.5 both are gs — again, unchanged.
        const gO = gs * 2 * lean;
        const gD = gs * 2 * (1 - lean);
        const dps = ((P.dps1 * f) / (1 + C)) * atkStat * gO;
        const hp = ((P.hp1 * f) / (1 + C)) * defStat * gD;
        const dfn = P.def1 * f * gD;
        const red = dfn / (dfn + kAnchor() * f);
        const ehp = hp / (1 - red);
        return {
          dps,
          hp,
          ehp,
          red,
          pDef: dfn,
          cs: Math.sqrt(dps * ehp),
          pAtk: (dps * P.physMix) / P.aspd,
          mAtk: (dps * (1 - P.physMix)) / P.castRate,
          mspd: Math.min(P.mspdBase * (1 + C * a), P.mspdCap),
          mspdRaw: P.mspdBase * (1 + C * a),
        };
      }

      /** A mob is the max-grade player at its own level, scaled by the rank multiplier. */
      function mob(L, rank) {
        const r = DATA.proposed.ladder.find((x) => x.rank === rank);
        const ref = player(L, "max");
        const s = (v) => v * r.mult;
        return {
          mult: r.mult,
          cs: s(ref.cs),
          dps: s(ref.dps),
          ehp: s(ref.ehp),
          hp: s(ref.hp),
          pAtk: s(ref.pAtk),
          pDef: s(ref.pDef),
        };
      }

      /**
       * R = how long the player survives ÷ how long the encounter survives.
       * R > 1 is a win and 1 − 1/R is the HP left.
       *
       * n = 1 is THE FOUNDATION: R = (CS_p / CS_m)². CombatScore is the exact
       * sufficient statistic — the DPS/EHP split cancels entirely.
       *
       * n > 1 layers on the party factor 2n/(n+1): the party focus-fires, so mobs
       * die one at a time and the average number still alive is (n+1)/2 rather
       * than n. Encounter size is a property of the FIGHT, not of the mob's rank.
       */
      function R(L, rank, spec, n = 1) {
        const p = player(L, spec),
          m = mob(mobLevel(L), rank);
        const single = Math.pow(p.cs / m.cs, 2);
        return n <= 1 ? single : (single * 2 * n) / (n + 1);
      }

      function band(r) {
        for (const b of DATA.proposed.bands)
          if (b.max === null || r < b.max) return b.name;
        return "trivial";
      }
      const hpLeft = (r) =>
        r > 1 ? `${((1 - 1 / r) * 100).toFixed(0)}%` : "—";
      const midLevel = (rk) => Math.floor((rk.from + rk.to) / 2);

      function requirements() {
        return DATA.proposed.requirements.map((q) => {
          const r = R(q.level, q.rank, q.grade, q.solo ? 1 : rankRef(q.rank));
          return { ...q, r, band: band(r), ok: r >= q.min && r < q.max };
        });
      }

      function invariants() {
        const C = P.statCoef,
          G = P.growth;
        const reds = [];
        for (let L = 1; L <= P.levelMax; L++) reds.push(player(L, "max").red);
        const statShare = C / (1 + C); // provably flat: CS scales by (1 + C·alloc)
        const sss = DATA.proposed.ladder[DATA.proposed.ladder.length - 1];
        const biggestHp = mob(sss.to, sss.rank).hp * sss.n;
        const reqs = requirements();
        const capAtMax = P.mspdBase * (1 + C * 1.0);
        const flat = [1, 25, 50, 75, P.levelMax].map((L) =>
          R(L, "C", "max", 1),
        );

        return [
          [
            "20-level growth in 120–160%",
            `${((Math.pow(G, 20) - 1) * 100).toFixed(0)}%`,
            Math.pow(G, 20) - 1 >= 1.2 && Math.pow(G, 20) - 1 <= 1.6,
          ],
          [
            "CS compounds at the growth rate",
            `${((player(2, "max").cs / player(1, "max").cs - 1) * 100).toFixed(2)}%`,
            Math.abs(player(2, "max").cs / player(1, "max").cs - G) < 1e-9,
          ],
          [
            "mitigation % flat across levels",
            `${(reds[0] * 100).toFixed(0)}%`,
            Math.max(...reds) - Math.min(...reds) < 1e-9,
          ],
          [
            "stat share ≥25% at every level",
            `${(statShare * 100).toFixed(1)}% flat`,
            statShare >= 0.25,
          ],
          [
            "stat cap never exceeds 99",
            `${DATA.proposed.statCapAtLMax}`,
            DATA.proposed.statCapAtLMax <= 99,
          ],
          [
            "largest encounter HP fits int32",
            biggestHp.toLocaleString(undefined, { maximumFractionDigits: 0 }),
            biggestHp < 2 ** 31,
          ],
          [
            "all four requirements",
            `${reqs.filter((r) => r.ok).length}/${reqs.length}`,
            reqs.every((r) => r.ok),
          ],
          [
            `move speed within clamp ${P.mspdCap}`,
            capAtMax.toFixed(1),
            capAtMax <= P.mspdCap,
          ],
          // Pure exponential growth means L cancels out of CS_p/CS_m. If this
          // fails, some term stopped riding the level curve.
          [
            "R invariant to absolute level",
            `${flat[0].toFixed(4)} at every level`,
            Math.max(...flat) - Math.min(...flat) < 1e-9,
          ],
        ];
      }

      // ============================================================= render ==

      /** Every abbreviation on the page. A header missing here fails verify.mjs. */
      const TERMS = {
        "mob rank": [
          "Mob rank",
          "Content tier E through SSS. Sets how strong one mob is RELATIVE to a same-level player. It does not imply a level or a headcount.",
        ],
        "mob CS ÷ player CS": [
          "Rank multiplier",
          "The mob's CombatScore as a fraction of a max-grade same-level player's. 0.5 means half as strong as you.",
        ],
        was: [
          "Previous multiplier",
          "The value before I-028. Comparison only — no calculation uses it.",
        ],
        "R · 1v1": [
          "R for a single duel",
          "One player against one mob. This is the foundation; everything else layers on top of it.",
        ],
        "player HP left": [
          "Player HP remaining",
          "1 − 1/R. Blank when you lose.",
        ],
        "player build": [
          "Stat allocation completeness",
          "How fully stat points were spent: low 0.4, mid 0.7, high 1.0.",
        ],
        "player gear": [
          "Equipment tier",
          "E, C or A. Gear tiers do not exist in the game — this scale is authored design data and the weakest-grounded input here.",
        ],
        "player level": ["Player level", "1 to 99."],
        "mob level": [
          "Mob level",
          "Independent of rank. Equals the player's unless you set an offset; shown red when it differs.",
        ],
        "player CS": [
          "CombatScore",
          "√(DPS × EHP). The single number that decides a duel — the split between damage and survivability cancels out.",
        ],
        "mob CS": ["Mob CombatScore", "√(DPS × EHP) for one mob."],
        "player pAtk": ["Physical attack", "Physical damage per hit."],
        "player mAtk": ["Magic attack", "Magic damage per cast."],
        "player pDef": [
          "Physical defence",
          "Feeds mitigation via pDef / (pDef + K).",
        ],
        "mob pAtk": ["Mob physical attack", "Physical damage per hit."],
        "mob pDef": [
          "Mob physical defence",
          "Same mitigation formula as the player.",
        ],
        "player maxHP": [
          "Maximum health",
          "Raw health pool, before mitigation.",
        ],
        "mob HP": ["Mob maximum health", "Raw health pool, before mitigation."],
        "damage mitigated †": [
          "Damage reduction",
          "Share of incoming damage absorbed. Constant at every level by design — K(L) grows at the same rate as pDef.",
        ],
        "player EHP": [
          "Effective health",
          "maxHP ÷ (1 − mitigation). Raw damage needed to kill you.",
        ],
        "player move speed †": [
          "Movement speed",
          "World units per second. No level term at all — a level 99 player moves as fast as a level 1 with the same allocation.",
        ],
        "time to kill 1 mob": [
          "Time to kill one mob",
          "Seconds for the party to focus down a single mob. Level-invariant.",
        ],
        "time to clear pack": [
          "Time to clear the encounter",
          "Seconds to kill all n mobs.",
        ],
        "encounter size (n)": [
          "Encounter size",
          "n players against n mobs. A property of the FIGHT, not of the rank — an input you set, not a column of the ladder.",
        ],
        "party factor 2n/(n+1)": [
          "Party advantage multiplier",
          "How much easier n-vs-n is than a duel. 1.0 at n=1, approaching 2.0 and never reaching it.",
        ],
        "damage you actually take": [
          "Share of theoretical incoming damage",
          "(n+1)/2n — mobs die progressively under focus fire rather than all living to the end.",
        ],
        "gear class": [
          "What the player's gear is FOR",
          "Where the gear budget points: tank gear buys HP and pDef, dps gear buys attack. Direction, not size — set the split with the Gear class lean slider. INVENTED: no gear-class concept exists in code.",
        ],
        "gear tier": [
          "How good the player's gear is",
          "Size of the gear budget, independent of what it is for. low = E (0.70), high = A (1.00). INVENTED: weapons.ts has archetypes, not tiers.",
        ],
        "build focus": [
          "Where the player spent stat points",
          "full DPS = every point into offense, full tank = every point into defence, balanced = the even split every other table on this page uses.",
        ],
        "relative strength": [
          "CombatScore vs the strongest of the eight",
          "Level-invariant, so it holds at every level. 100% is the best group; everything else is that fraction of it.",
        ],
        "player HP left": [
          "Fraction of your HP still there when the encounter dies",
          "1 − 1/R. Negative means the encounter killed you first, and the size of the negative is how far short you fell. HP consumed is 100 minus this.",
        ],
        effect: ["Plain-language summary", "The same number as a percentage."],
        invariant: [
          "Structural property",
          "Something the model must satisfy regardless of tuning. A FAIL means the current settings broke the design.",
        ],
      };

      const n0 = (v) =>
        v.toLocaleString(undefined, { maximumFractionDigits: 0 });
      const rCell = (r) =>
        `<span class="pill b-${band(r)}">${r.toFixed(2)} ${band(r)}</span>`;

      function th(h) {
        const key = String(h)
          .replace(/<[^>]*>/g, "")
          .trim();
        const t = TERMS[key];
        return t
          ? `<th><span class="term" title="${t[0]} — ${t[1]}">${h}</span></th>`
          : `<th>${h}</th>`;
      }

      function table(headers, rows) {
        return `<div class="scroll"><table><thead><tr>${headers.map(th).join("")}</tr></thead>
          <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
          </table></div>`;
      }

      /** Title plus one line stating what the table answers and whose numbers they are. */
      function section(title, question) {
        return `<h2>${title}</h2><div class="qline">${question}</div>`;
      }

      function renderLegend() {
        const bands = DATA.proposed.bands
          .map(
            (b) =>
              `<span class="pill b-${b.name}">${b.name}</span> ${b.max === null ? "≥ 8" : `&lt; ${b.max}`}`,
          )
          .join(" · ");
        return `${section(
          "How to read this page",
          "Three things vary: the <b>player</b> (level, build, gear), the <b>mob</b> (rank, level), and the <b>encounter</b> (how many a side).",
        )}
        <div class="panel">
          <div class="legend-grid">
            <div><div class="legend-h">PLAYER</div><div class="legend-b">
              <code>build</code> = how fully stat points were spent. <code>gear</code> = equipment tier.
              <code>CS</code> = CombatScore = <code>√(DPS × EHP)</code>.</div></div>
            <div><div class="legend-h">MOB</div><div class="legend-b">
              <code>rank</code> = E → SSS. Sets strength <i>relative to a same-level player</i> and nothing
              else. Level and headcount are separate inputs.</div></div>
            <div><div class="legend-h">OUTCOME — R</div><div class="legend-b">
              How long the <b>player</b> survives ÷ how long the <b>encounter</b> survives.
              <code>R &gt; 1</code> = win, <code>1 − 1/R</code> = HP left.
              A duel is exactly <code>(CS_player / CS_mob)²</code>.</div></div>
          </div>
          <div class="legend-h" style="margin-top:14px">BANDS</div>
          <div class="legend-b">${bands}</div>
        </div>`;
      }

      function renderInputs() {
        const defs = DATA.proposed.inputs;
        return `${section(
          "Inputs — the knobs",
          "These drive <b>both</b> sides: a mob is a scaled copy of the max-grade player, so anything applied to both cancels in R. Only <code>Stat coefficient C</code>, <code>Encounter size</code>, <code>Mob level − player level</code> and the rank multipliers change an outcome.",
        )}
        <div class="panel grid-inputs">${Object.entries(defs)
          .map(
            ([k, d]) => `<div class="input-row">
            <label for="in-${k}">${d.label} <b id="lbl-${k}">${P[k]}</b></label>
            <input type="range" id="in-${k}" data-key="${k}" min="${d.min}" max="${d.max}" step="${d.step}" value="${P[k]}" />
          </div>`,
          )
          .join("")}</div>
        <div style="margin-top:10px"><button id="reset">Reset to spec defaults</button></div>`;
      }

      function renderRequirements() {
        const reqs = requirements();
        const all = reqs.every((r) => r.ok);
        return `${section(
          "Requirements — the four outcomes you specified",
          "Each card fixes a <b>player</b> grade, a <b>mob</b> rank and a level, then checks R lands in the band you asked for. These use each rank's reference encounter size, not the slider.",
        )}
        <div class="banner ${all ? "ok" : "bad"}">${all ? "ALL FOUR PASS" : `${reqs.filter((r) => !r.ok).length} FAILING`}</div>
        <div class="cards">${reqs
          .map(
            (q) => `<div class="card ${q.ok ? "pass" : "fail"}">
          <div class="req">${q.label}</div>
          <div class="val">${q.r.toFixed(2)} <span class="pill b-${q.band}">${q.band}</span></div>
          <div class="verdict">${q.ok ? "PASS" : "FAIL"}</div>
          <div class="bound">needs ${q.min} ≤ R &lt; ${q.max} · L${q.level} ${q.rank} ${q.grade} ${q.solo ? "1v1" : "party"}</div>
        </div>`,
          )
          .join("")}</div>`;
      }

      function renderLadder() {
        const n = P.encounterSize;
        const rows = DATA.proposed.ladder.map((rk) => {
          const L = midLevel(rk);
          const duel = R(L, rk.rank, "max", 1);
          return [
            `<b>${rk.rank}</b>`,
            rk.mult.toFixed(3),
            `<span class="dim">${rk.was.toFixed(2)}</span>`,
            rCell(duel),
            hpLeft(duel),
            n > 1
              ? rCell(R(L, rk.rank, "max", n))
              : `<span class="dim">—</span>`,
          ];
        });
        return `${section(
          "Rank ladder — how strong is each MOB tier",
          "One row per <b>mob</b> rank against a <b>max-grade player</b>. Rank carries strength and nothing else — no level, no headcount. R is identical at level 1 and level 99 because player and mob grow at the same rate, so only the level <i>difference</i> matters.",
        )}
        ${table(
          [
            "mob rank",
            "mob CS ÷ player CS",
            "was",
            "R · 1v1",
            "player HP left",
            n > 1
              ? `R · ${n}v${n}`
              : `R · ${n}v${n} <span class="dim">(raise Encounter size)</span>`,
          ],
          rows,
        )}
        ${renderPartyFactor()}`;
      }

      /** Why n changes anything, and the requirement it places on the AI. */
      function renderPartyFactor() {
        const rows = [1, 2, 4, 8, 20, 50].map((n) => [
          n,
          ((2 * n) / (n + 1)).toFixed(3),
          `${(((n + 1) / 2 / n) * 100).toFixed(0)}%`,
          `${(((2 * n) / (n + 1) - 1) * 100).toFixed(0)}% easier than 1v1`,
        ]);
        return `<div class="panel" style="margin-top:14px">
          <div class="legend-h">WHY n MATTERS — 4v4 IS NOT THE SAME AS 1v1</div>
          <div class="legend-b" style="margin-bottom:12px">
            The party <b>focus-fires</b>: all n players hit one mob, so mobs die one at a time and the pack's
            damage decays. The average number still alive is <code>(n+1)/2</code>, not <code>n</code>, so you
            absorb far less than n mobs could theoretically deal. That is <code>2n/(n+1)</code> — and it is
            <b>bounded at 2×</b>. No party size makes a symmetric fight more than twice as favourable as a duel.
          </div>
          ${table(
            [
              "encounter size (n)",
              "party factor 2n/(n+1)",
              "damage you actually take",
              "effect",
            ],
            rows,
          )}
          <div class="banner info" style="margin-top:12px">
            <b>This is a specification, not a measurement.</b> It holds only while mobs do not coordinate focus
            fire. If they all attacked one player the n² terms cancel by symmetry and R collapses to the duel
            value. So <b>"mobs must not coordinate target selection" is a requirement the AI has to satisfy</b>,
            and it belongs in the spec beside the multipliers.
            <br /><br />
            <b>Open design question:</b> the model has no concept of formation, yet formation decides whether
            this factor applies at all — a clumped party is nearest to every mob at once. How much positioning
            should be worth (currently up to 1.96×, implicitly) has not been decided.
          </div>
        </div>`;
      }

      function renderMatrix() {
        const { builds, gearTiers, grades, ladder } = DATA.proposed;
        const n = P.encounterSize;
        const named = (b, g) =>
          grades.find((x) => x.build === b && x.gear === g);
        const rows = [];
        for (const b of builds) {
          for (const g of gearTiers) {
            const nm = named(b.build, g.tier);
            rows.push([
              `<b>${b.build}</b>${nm ? ` <span class="dim">· ${nm.grade}</span>` : ""}`,
              g.tier,
              ...ladder.map((rk) =>
                rCell(
                  R(midLevel(rk), rk.rank, { build: b.build, gear: g.tier }, n),
                ),
              ),
            ]);
          }
        }
        return `${section(
          "Outcome matrix — who beats what",
          `Rows are the <b>player</b> (${builds.length} builds × ${gearTiers.length} gear tiers). Columns are the <b>mob</b> rank. Each cell is R for ${
            n <= 1
              ? "<b>one player against one mob</b> — the foundation"
              : `<b>${n} players against ${n} mobs</b>`
          }. ${
            P.mobLevelDelta
              ? "Header levels are the <b>mob's</b>, with yours beside them."
              : "Header levels do <b>not</b> affect any cell — R is the same at every level."
          }`,
        )}
        ${table(
          [
            "player build",
            "player gear",
            ...ladder.map(
              (rk) =>
                `vs ${rk.rank} mob · L${mobLevel(midLevel(rk))}` +
                (P.mobLevelDelta
                  ? ` <span class="dim">(you L${midLevel(rk)})</span>`
                  : ""),
            ),
          ],
          rows,
        )}`;
      }

      /**
       * The eight player groups: [gear class] x [gear tier] x [build focus].
       * Scored the way you asked — time to kill, and HP left over.
       */
      function renderArchetypes() {
        const { archetypes, archetypeRanks, ladder } = DATA.proposed;
        const n = P.encounterSize;
        const ranks = archetypeRanks.map((r) =>
          ladder.find((x) => x.rank === r),
        );
        const spec = (a) => ({
          build: "high",
          gear: a.gear,
          focus: a.focus,
          gearClass: a.gearClass,
        });
        // Level-invariant, so any reference level gives the same ratio.
        const cs = archetypes.map((a) => player(50, spec(a)).cs);
        const best = Math.max(...cs);

        const cell = (a, rk) => {
          const L = midLevel(rk);
          const p = player(L, spec(a)),
            m = mob(mobLevel(L), rk.rank);
          const r = R(L, rk.rank, spec(a), n);
          // n cancels: n players share n mobs' worth of EHP.
          const ttk = m.ehp / p.dps;
          const left = (1 - 1 / r) * 100;
          return (
            `<span class="pill b-${band(r)}">${ttk < 100 ? ttk.toFixed(1) : ttk.toFixed(0)}s</span>` +
            `<div class="${left < 0 ? "FAIL" : "dim"}">${left >= 0 ? "+" : ""}${left.toFixed(0)}% HP left</div>`
          );
        };

        const rows = archetypes.map((a, i) => [
          `<b>${a.gearClass}</b> gear`,
          a.tier,
          a.focus,
          `${((cs[i] / best) * 100).toFixed(0)}%`,
          ...ranks.map((rk) => cell(a, rk)),
        ]);

        return `${section(
          "Eight player groups — time to kill, and what it costs you",
          `Rows are the <b>player</b>: gear class × gear tier × build focus, 2×2×2. All eight are
           <b>fully allocated</b> — "full DPS" and "full tank" are directions, not amounts.
           Columns are the <b>mob</b> rank, E through SS. Each cell is
           <b>time to kill the encounter</b> (level-invariant) over <b>player HP left</b>,
           which is <code>100 − HP consumed</code> and <b>goes negative when the fight kills you</b> —
           the negative is how far short you fell. ${
             n <= 1
               ? "One player, one mob."
               : `<b>${n} players against ${n} mobs.</b>`
           }
           SSS is omitted: it is the unresolved boss-or-pack rank.`,
        )}
        ${table(
          [
            "gear class",
            "gear tier",
            "build focus",
            "relative strength",
            ...ranks.map((rk) => `vs ${rk.rank} mob`),
          ],
          rows,
        )}`;
      }

      function renderCurve() {
        const rows = [1, 20, 40, 60, 80, P.levelMax].map((L) => {
          const p = player(L, "max");
          return [
            L,
            n0(p.cs),
            n0(p.pAtk),
            n0(p.mAtk),
            n0(p.hp),
            n0(p.pDef),
            `${(p.red * 100).toFixed(0)}%`,
            n0(p.ehp),
            p.mspdRaw > P.mspdCap
              ? `<span class="FAIL">${p.mspd.toFixed(1)} clamped</span>`
              : p.mspd.toFixed(1),
          ];
        });
        return `${section(
          "Player curve — what a PLAYER looks like at each level",
          "No mobs here. A max-grade player at each level. † Mitigation and move speed are <b>constant at every level by design</b> — mitigation because the defence constant rides the same curve as pDef, move speed because it has no level term. Making either grow with level is a change to the model, not a tuning value.",
        )}
        ${table(
          [
            "player level",
            "player CS",
            "player pAtk",
            "player mAtk",
            "player maxHP",
            "player pDef",
            "damage mitigated †",
            "player EHP",
            "player move speed †",
          ],
          rows,
        )}
        ${sparkline()}`;
      }

      /** CS vs level per grade. Log-y — CS spans ~75× over 99 levels. */
      function sparkline() {
        const W = 720,
          H = 200,
          PAD = 34;
        const colors = { max: "#7c9eff", median: "#7ee787", min: "#f2b84b" };
        const grades = DATA.proposed.grades.map((g) => g.grade);
        const all = grades.flatMap((g) => {
          const out = [];
          for (let L = 1; L <= P.levelMax; L++) out.push(player(L, g).cs);
          return out;
        });
        const lo = Math.log(Math.min(...all)),
          hi = Math.log(Math.max(...all));
        const x = (L) => PAD + ((L - 1) / (P.levelMax - 1)) * (W - PAD - 8);
        const y = (cs) =>
          H - PAD - ((Math.log(cs) - lo) / (hi - lo || 1)) * (H - PAD - 10);
        const paths = grades
          .map((g) => {
            let d = "";
            for (let L = 1; L <= P.levelMax; L++)
              d += `${L === 1 ? "M" : "L"}${x(L).toFixed(1)},${y(player(L, g).cs).toFixed(1)} `;
            return `<path d="${d}" fill="none" stroke="${colors[g]}" stroke-width="1.8"/>`;
          })
          .join("");
        const legend = grades
          .map(
            (g, i) =>
              `<text x="${PAD + 8 + i * 76}" y="16" fill="${colors[g]}" font-size="11">■ ${g}</text>`,
          )
          .join("");
        const ticks = [1, 25, 50, 75, P.levelMax]
          .map(
            (L) =>
              `<text x="${x(L)}" y="${H - 12}" fill="#656d80" font-size="10" text-anchor="middle">${L}</text>`,
          )
          .join("");
        return `<div class="panel" style="margin-top:12px">
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${legend}${paths}${ticks}
            <text x="4" y="${y(Math.exp(hi))}" fill="#656d80" font-size="10">${n0(Math.exp(hi))}</text>
            <text x="4" y="${y(Math.exp(lo))}" fill="#656d80" font-size="10">${n0(Math.exp(lo))}</text>
          </svg>
          <div class="meta">CombatScore vs level (log scale)</div></div>`;
      }

      function renderMobs() {
        const n = P.encounterSize;
        const rows = DATA.proposed.ladder.map((rk) => {
          const L = midLevel(rk),
            Lm = mobLevel(L);
          const p = player(L, "max"),
            m = mob(Lm, rk.rank);
          const ttk1 = m.ehp / (p.dps * n);
          return [
            `<b>${rk.rank}</b>`,
            L,
            Lm === L ? Lm : `<span class="FAIL">${Lm}</span>`,
            n0(m.cs),
            n0(m.hp),
            n0(m.pAtk),
            n0(m.pDef),
            `${ttk1.toFixed(1)}s`,
            `${(ttk1 * n).toFixed(0)}s`,
          ];
        });
        return `${section(
          "Mob stats — what a MOB looks like at each rank",
          `One row per <b>mob</b> rank. The two time columns are for a party of <b>${n}</b> max-grade players — raise <code>Encounter size</code> to change them.`,
        )}
        ${table(
          [
            "mob rank",
            "player level",
            "mob level",
            "mob CS",
            "mob HP",
            "mob pAtk",
            "mob pDef",
            "time to kill 1 mob",
            "time to clear pack",
          ],
          rows,
        )}`;
      }

      function renderInvariants() {
        const inv = invariants();
        const all = inv.every(([, , ok]) => ok);
        return `${section(
          "Invariants — does the MODEL itself hold up",
          "Not about any player or mob. Structural properties the model must satisfy at every level; a FAIL means the current settings broke the design.",
        )}
        <div class="banner ${all ? "ok" : "bad"}">${all ? "ALL PASS" : "SOME FAILED"}</div>
        ${table(
          ["invariant", "value", "result"],
          inv.map(([n, v, ok]) => [
            n,
            v,
            `<span class="${ok ? "PASS" : "FAIL"}">${ok ? "PASS" : "FAIL"}</span>`,
          ]),
        )}`;
      }

      function renderGlossary() {
        const rows = Object.entries(TERMS).map(([k, [full, desc]]) => [
          `<b>${k}</b>`,
          full,
          `<span class="dim">${desc}</span>`,
        ]);
        return `${section(
          "Glossary",
          "Every abbreviation used above. Column headers carry the same text as a hover tooltip.",
        )}
        <div class="scroll"><table class="gloss-t"><thead><tr><th>as shown</th><th>full name</th><th>meaning</th></tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td class="gloss">${c}</td>`).join("")}</tr>`).join("")}</tbody>
        </table></div>`;
      }

      function renderNotes() {
        return `${section("Not covered here", "Read these before treating any verdict above as final.")}
        <ul class="notes">
          <li>Closed-form only — no crit variance, misses, kiting or movement; perfect focus-fire assumed.
              A <code>BattleModule</code> run is what would turn this from a model into evidence.</li>
          ${DATA.proposed.openQuestions.map((q) => `<li>${q}</li>`).join("")}
        </ul>
        ${section("Provenance", "Where the numbers come from.")}
        <ul class="notes">
          <li>Everything here comes from <code>combat-model.json</code>, generated by
              <code>scripts/gen_combat_model.mjs</code>. That file holds the model and nothing else — it does
              not read the game's source. Reconciling the model with what ships is a separate, later job.</li>
          <li>Mirrors <code>${DATA.proposed.reference}</code>; <code>verify.mjs</code> asserts they agree.</li>
          <li>Spec: <code>${DATA.proposed.spec}</code></li>
        </ul>`;
      }

      function renderAll() {
        document.getElementById("app").innerHTML = [
          renderLegend(),
          renderInputs(),
          renderRequirements(),
          renderLadder(),
          renderMatrix(),
          renderArchetypes(),
          renderCurve(),
          renderMobs(),
          renderInvariants(),
          renderGlossary(),
          renderNotes(),
        ].join("");
        wire();
      }

      function wire() {
        for (const input of document.querySelectorAll('input[type="range"]')) {
          input.addEventListener("input", (e) => {
            P[e.target.dataset.key] = parseFloat(e.target.value);
            const id = e.target.id,
              pos = e.target.value;
            renderAll();
            const again = document.getElementById(id);
            if (again) {
              again.value = pos;
              again.focus();
            }
          });
        }
        document.getElementById("reset").addEventListener("click", () => {
          loadDefaults();
          renderAll();
        });
      }

      function loadDefaults() {
        P = { levelMax: DATA.proposed.levelMax };
        for (const [k, d] of Object.entries(DATA.proposed.inputs))
          P[k] = d.value;
      }

      fetch(`combat-model.json?v=${Date.now()}`) // regenerated often; never cache
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then((json) => {
          DATA = json;
          loadDefaults();
          document.getElementById("hdr").textContent =
            `generated ${json.generatedAt} · schema v${json.version} · ` +
            `the I-028 model only — nothing here is read from the game`;
          renderAll();
        })
        .catch(() => {
          document.getElementById("hdr").textContent = "load failed";
          document.getElementById("err").hidden = false;
        });
    </script>
  </body>
</html>
