services:
  atlas-colyseus-server:
    build:
      context: .
      dockerfile: colyseus-server/Dockerfile
    container_name: atlas-world-colyseus-server
    ports:
      - "2567:2567"        # Colyseus WebSocket server
    environment:
      - NODE_ENV=production
      - PORT=2567
    restart: unless-stopped
    networks:
      - atlas-network

networks:
  atlas-network:
    driver: bridge
