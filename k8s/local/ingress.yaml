# Local Kubernetes Ingress for Atlas World Studio (:8788 on host) and cluster services.
# Routes *.joymify.local.com (and legacy *.joymify.local) via ingress-nginx so
# both the Mac and Tailscale devices (iPad / iPhone via tailscale-dns) can access
# Atlas World without specifying a port.
apiVersion: v1
kind: Service
metadata:
  name: atlas-world-studio-host
  namespace: atlas-world
  labels:
    app: atlas-world-studio
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8788
      targetPort: 8788
---
apiVersion: v1
kind: Endpoints
metadata:
  name: atlas-world-studio-host
  namespace: atlas-world
  labels:
    app: atlas-world-studio
subsets:
  - addresses:
      # OrbStack stable bridge IP for host.docker.internal (macOS host)
      - ip: 0.250.250.254
    ports:
      - name: http
        port: 8788
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-world-local
  namespace: atlas-world
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: atlas-world.joymify.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-world-studio-host
                port:
                  number: 8788
    - host: atlas.joymify.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-world-studio-host
                port:
                  number: 8788
    - host: atlas-world.joymify.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-world-studio-host
                port:
                  number: 8788
    - host: atlas-storybook.joymify.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asset-storybook
                port:
                  number: 6006
