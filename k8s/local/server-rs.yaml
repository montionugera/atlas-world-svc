apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-rs
  namespace: atlas-world
  labels:
    app: server-rs
spec:
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: server-rs
  template:
    metadata:
      labels:
        app: server-rs
    spec:
      containers:
        - name: server-rs
          image: atlas-world-server-rs:local
          imagePullPolicy: Never
          ports:
            - name: ws
              containerPort: 2567
          livenessProbe:
            httpGet:
              path: /healthz
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: ws
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:2567"
            - name: AGONES_ENABLED
              value: "false"
            - name: NAKAMA_SERVER_KEY
              value: "atlas_dev_session_key_change_me_please_32"
            - name: NAKAMA_URL
              value: "http://nakama:7350"
            - name: NAKAMA_HTTP_KEY
              value: "atlas_dev_http_key"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "2"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: server-rs
  namespace: atlas-world
  labels:
    app: server-rs
spec:
  type: LoadBalancer
  selector:
    app: server-rs
  ports:
    - name: ws
      port: 2567
      targetPort: ws
---
# Optional Agones GameServer template when Agones CRD is installed
apiVersion: "agones.dev/v1"
kind: GameServer
metadata:
  name: server-rs-gameserver
  namespace: atlas-world
spec:
  ports:
    - name: default
      containerPort: 2567
      portPolicy: Dynamic
  template:
    spec:
      containers:
        - name: server-rs
          image: atlas-world-server-rs:local
          imagePullPolicy: Never
          env:
            - name: AGONES_ENABLED
              value: "true"
            - name: BIND_ADDR
              value: "0.0.0.0:2567"
            - name: NAKAMA_SERVER_KEY
              value: "atlas_dev_session_key_change_me_please_32"
            - name: NAKAMA_URL
              value: "http://nakama:7350"
            - name: NAKAMA_HTTP_KEY
              value: "atlas_dev_http_key"
