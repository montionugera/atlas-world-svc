server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative Location headers. The container listens on 80 but the
    # Service publishes 6006, so nginx's default absolute redirect rebuilds the
    # URL with its OWN port and sends the browser to http://localhost/… — which
    # 404s. A relative Location is resolved by the browser against the original
    # host:port and survives any port mapping or port-forward.
    absolute_redirect off;

    # The storybook is served from /tools/asset-storybook/ rather than the root
    # because its index.html reaches assets through paths that escape its own
    # directory (../../game-client/assets/…, ../../colyseus-server/generated/…,
    # ../combat-lab/…). Those only resolve when the document root is the repo
    # root with the original layout intact, so the page keeps its real path and
    # / just redirects to it.
    location = / {
        return 302 /tools/asset-storybook/index.html;
    }

    # Probe target for the readiness/liveness checks in k8s/local/storybook.yaml.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Manifests are regenerated on every build and are small. Serving a stale
    # cached copy is the most confusing failure mode this page has — the grid
    # renders against one manifest while the files on disk are another.
    #
    # .mjs is covered for the same reason, added when the storybook's inline
    # <script> was split into tools/asset-storybook/js/*.mjs (Task 9): before
    # the split, any JS edit changed index.html's own bytes, so a normal
    # (non-hard) reload always re-fetched it. Now a JS-only edit leaves
    # index.html byte-identical and only the .mjs files change — a browser
    # that heuristically cached those modules on an earlier visit would keep
    # serving the stale code against a fresh page indefinitely. Hit this
    # exact failure mode manually while verifying the split in a container.
    location ~ \.(json|mjs)$ {
        add_header Cache-Control "no-store";
    }

    # autoindex makes a missing asset obvious (you get a listing of what IS
    # there) instead of a bare 404 with no clue about the path.
    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }
}
