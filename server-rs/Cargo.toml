[package]
name = "server-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_ecs = { version = "0.15", features = ["multi_threaded"] }
bevy_tasks = { version = "0.15", features = ["multi_threaded"] }
rapier2d = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.29"
rand = "0.8"
flatbuffers = "24.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sim_scale"
harness = false
