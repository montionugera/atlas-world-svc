name: contracts

# Run @atlas/contracts' own unit tests.
# Mirrors ci.yml's toolchain (pnpm · Node 18 · --filter).
on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (unit tests · codegen · drift · smoke)
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build @atlas/contracts first: it resolves from dist and has no prepare
      # hook, so its own tests can't resolve the '@atlas/contracts' self-import
      # on a clean install until it's built.
      - name: Build contracts (@atlas/contracts)
        run: pnpm --filter @atlas/contracts run build

      - name: Contracts unit tests (@atlas/contracts)
        run: pnpm --filter @atlas/contracts test
