name: contracts

# Run @atlas/contracts' own unit tests, then regenerate the C# schema
# contracts and fail on any drift, smoke, or codegen regression.
# Mirrors ci.yml's toolchain (pnpm · Node 18 · --filter).
on:
  pull_request:
    paths:
      - 'colyseus-server/src/schemas/**'
      - 'colyseus-server/src/codegen/**'
      - 'colyseus-server/scripts/codegen/**'
      - 'colyseus-server/generated/csharp/**'
      - 'contracts/src/meta/**'
      - 'contracts/content/**'

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (unit tests · codegen · drift · smoke)
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contracts unit tests (@atlas/contracts)
        run: pnpm --filter @atlas/contracts test

      - name: Contracts suite (codegen · smoke · drift · jest · package shape)
        run: pnpm --filter atlas-world-colyseus-server run test:contracts
