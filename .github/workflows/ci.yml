name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  colyseus-server:
    name: colyseus-server (typecheck · format · test)
    runs-on: ubuntu-latest
    env:
      HUSKY: "0" # skip husky install in CI (no git hooks needed)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # The Node major is a DETERMINISM PIN (world-fill Plan C, R5), not a
      # preference: it is the Node the map tooling and every byte comparison
      # run on. .release.json is the single authority and
      # scripts/tests/node-pin.test.mjs asserts this file reads it.
      #
      # It is NOT the deployment runtime, and the line this replaces claimed it
      # was: colyseus-server/Dockerfile has been node:22-alpine since release
      # 1.2. That number is recorded in .release.json as runtimeNodeMajor and
      # joined to the Dockerfile by the same test, so the two can diverge on
      # purpose but never by accident.
      #
      # Read with grep, not `node -p`: there is no Node yet at this point.
      - name: Read the pinned Node major from .release.json
        id: nodepin
        run: |
          MAJOR="$(grep -o '"nodeMajor"[[:space:]]*:[[:space:]]*[0-9]*' .release.json | grep -o '[0-9]*$')"
          test -n "$MAJOR" || { echo "::error::.release.json has no nodeMajor pin"; exit 1; }
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodepin.outputs.major }}
          cache: pnpm

      # Workspace install at the repo root (pnpm-workspace.yaml lives here).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @atlas/contracts resolves from dist (main/types → dist/) and has no
      # prepare hook, so a clean install leaves it unbuilt. The server's
      # src/meta/* import it, so build it before typecheck/test or module
      # resolution fails.
      - name: Build contracts (@atlas/contracts)
        run: pnpm --filter @atlas/contracts run build

      - name: Typecheck (tsc --noEmit)
        run: pnpm --filter atlas-world-colyseus-server run typecheck

      - name: Format check (prettier)
        run: pnpm --filter atlas-world-colyseus-server run format:check

      - name: Test (jest)
        run: pnpm --filter atlas-world-colyseus-server run test

      # Asset pipeline drift-gate (F-002): the client manifest must stay
      # consistent with the codegen-emitted key set and the files on disk.
      # Refresh generated/asset-keys.json from the live server config FIRST
      # (contracts already built above) so the gate checks current keys, not a
      # stale committed snapshot; then run the checker. Stage-0: unmapped keys
      # are warnings, broken paths / missing licenses are hard failures.
      - name: Codegen asset keys + mob types (refresh generated/*.json)
        run: |
          bash colyseus-server/scripts/codegen/gen-asset-keys.sh
          bash colyseus-server/scripts/codegen/gen-mob-types.sh

      - name: Asset manifest drift-gate (keys ↔ manifest ↔ files ↔ license)
        run: node scripts/check_asset_manifest.mjs

      # Content gate (F-005): character sheets must validate against schema
      # and stay linked to real asset keys / manifest tiers. Coverage gaps
      # (character keys with no sheet) are warnings until roadmap #1 flips
      # --require-complete. Also runs the gate's own unit tests (plus the shared scripts/tests suite).
      - name: Content gate (sheets ↔ schema ↔ keys ↔ manifest)
        run: |
          npm ci --prefix scripts
          npm test --prefix scripts
          node scripts/check_content.mjs

      # I-048: Season 1 budget report. Informational only — report_season1.mjs
      # always exits 0, so this step can never redden the build. `if: always()`
      # plus posting to $GITHUB_STEP_SUMMARY means the delta is still visible
      # on the run summary page even when an earlier step (typecheck, jest,
      # the asset gate, the content gate) already failed — exactly the
      # content-churn PRs where the delta matters most.
      - name: Season 1 budget report
        if: always()
        run: |
          OUTPUT="$(node scripts/report_season1.mjs)"
          echo "$OUTPUT"
          {
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Story graph drift-gate (F-012): docs/story/story-graph.md is a
      # generated Mermaid visualization of the 7 story files (scripts/lib/story.mjs
      # loader, shared with the content gate above). Fails the build if the
      # committed artifact is stale relative to content/story/*.json.
      - name: Story graph drift-gate (docs/story/story-graph.md)
        run: node scripts/gen_story_graph.mjs --check

      # Plan E / spec §9.4: the seven canon walking distances measured against
      # the hand-placed Tier-1 pins, BEFORE the generator. Fails the build if
      # any leg is outside ±8% of straightKm or an endpoint fails to resolve.
      - name: canon-leg pre-flight
        run: node scripts/check_canon_legs.mjs

      # Plan E / spec §9.3: the whole-world digest — what replaces the freeze
      # once coordinates are generated. Fails if any of fabric / resolved /
      # trunk changed without a deliberate one-line re-baseline.
      - name: world digest
        run: node scripts/check_world_digest.mjs --check

      # Spine emit drift-gate (F-041 G-EMIT-DRIFT): every content/spine/nodes/
      # *.json `derived` block and the two surviving mirrors are emitted from
      # content/spine/nodes/* by scripts/check_spine_emit.mjs. Fails the build
      # if a committed emitted file is stale relative to the spine, or was
      # hand-edited. scripts/ deps are already installed by the Content gate
      # step above (npm ci --prefix scripts).
      - name: Spine emit drift-gate (G-EMIT-DRIFT)
        run: node scripts/check_spine_emit.mjs --check

      # Resolved join drift-gate (Plan D G-SLOT-STABLE): content/world/resolved/
      # *.json is the committed join of fabric + civil and the ONLY file
      # renderers read. Fails the build if a record silently rebound to a
      # different handle, or a resolved file was hand-edited. scripts/ deps are
      # already installed by the Content gate step above.
      - name: Resolved join drift-gate (G-SLOT-STABLE)
        run: node scripts/check_resolved.mjs --check

      # Plan D relation-coverage report: how much of the prose's n-ary claim
      # surface the authored relation layer models. Informational only —
      # report_relation_coverage.mjs always exits 0, so this step can never
      # redden the build; a miss against content/world/manifest.json's
      # `relations.coverageFloorPct` prints LOW so the debt stays visible.
      - name: Relation coverage (report)
        run: node scripts/report_relation_coverage.mjs

      # Render lock (Plan A G-RENDER-LOCK): every sheet in
      # tools/mapforge/render-sheet.mjs's SHEETS registry is rebuilt from the
      # live spine, hashed, and compared against content/world/render-lock.json
      # AND against the committed SVG on disk. Replaces G-MAP-DRIFT.
      - name: Render lock (G-RENDER-LOCK)
        run: node scripts/check_render_lock.mjs --check

      # X6: CI ran NEITHER the mapforge tests NOR render-sheet --check, so five
      # of six byte comparisons were Gate-2-only (local). That is the wrong
      # place for them once the map lane is the feature under active
      # development.
      #
      # SHELL-EXPANDED FILE LIST, UNQUOTED — this is NOT the quoted form used in
      # the local verify commands. The `node-version` pinned above comes from
      # .release.json's nodeMajor and is below 22 today; Node's own
      # `--test <glob-pattern>` support only arrived in v22. (Restating the pin
      # here as a literal is the staleness class the line this replaced was
      # caught by — scripts/tests/node-pin.test.mjs is where the number lives
      # and is joined to its consumer.) Quoting
      # here would hand Node 18 the literal string
      # "tools/mapforge/tests/*.test.mjs" as a path: the step would either error
      # on a nonexistent file or, worse, run zero tests and go green while
      # proving nothing. The working form is the one scripts/integration.sh and
      # scripts/package.json already use — let the shell expand it.
      - name: Mapforge test suite
        run: node --test tools/mapforge/tests/*.test.mjs

      # EVERY id in the SHEETS registry, not a subset. `fabric` and `overlay`
      # were covered only through G-RENDER-LOCK when they landed; the lock
      # compares hashes and this compares the drawing to the committed file,
      # which are different claims. tools/mapforge/tests/render-sheet.test.mjs
      # asserts this list IS the registry, so a sheet added without a line here
      # reds rather than going quietly uncovered.
      - name: Sheet self-check (render-sheet --check)
        run: |
          node tools/mapforge/render-sheet.mjs --sheet ashen-spar --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet atlas --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet brightfall --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet coldreach --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet driftholt --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet fabric --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet loamspit --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet overlay --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet quillreef --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet reedstrand --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet rimewall-cap --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet skerryfast --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet stonemoor --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet synthetic --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet thirstwold --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet wealdmarch --no-png --check
          node tools/mapforge/render-sheet.mjs --sheet wracklow --no-png --check

      # Story explorer (F-012 Task 6): graph.mjs is the pure buildGraph()
      # shared by tools/story-explorer/index.html and this smoke test — every
      # real story file resolves, no dangling edges, no prereq cycle, and a
      # synthetic fixture covers the event/dialogue edge kinds real content
      # doesn't exercise yet.
      - name: Story explorer smoke test
        run: node --test tools/story-explorer/tests/*.test.mjs

      # Asset storybook (F-038): the pure data layer — taxonomy resolution,
      # thumb-index join, verdict store. No DOM, so node --test covers it.
      # Without this step the storybook's tests only ever ran on a laptop.
      - name: Asset storybook data-layer tests
        run: node --test tools/asset-storybook/tests/*.test.mjs

      # Art forge (F-050): run-ledger, brief-hash, graph and gate unit suites.
      # Same Node 18 as above; the shell expands the glob (node:test accepts
      # explicit file paths). Without this step these tests only ran locally.
      - name: Art forge unit tests
        run: node --test tools/art-forge/tests/*.test.mjs

      # Asset forge (F-003): structural + game-rule validation for every
      # manifest entry whose glb exists on disk. Bespoke-tier failures are
      # hard failures; seed-tier issues are warnings only (known scale bug,
      # tracked as an F-002 follow-up) so this stays green today.
      - name: Asset forge — validate manifest glbs
        run: |
          npm ci --prefix tools/asset-forge
          node tools/asset-forge/validate.mjs --manifest game-client/assets/manifest.json
